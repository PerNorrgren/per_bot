# Per Bot 54 — the previous version of this file used aptPkgs =
# ["ffmpeg"], which is documented as a real Nixpacks option, but doesn't
# reliably provide ffprobe (found directly: another Railway user with
# the exact same aptPkgs = ["ffmpeg"] config hit the exact same
# "executable file not found" error). Nixpacks' own official
# documentation (nixpacks.com/docs/guides/configuring-builds) shows the
# correct, recommended way to add ffmpeg is nixPkgs, not aptPkgs — Nix's
# ffmpeg package reliably includes ffprobe alongside it, since they're
# built from the same source as one complete package rather than
# separately-resolved apt dependencies.
#
# The "..." is required and documented as important: it means "extend
# whatever Nixpacks already auto-detected for this app" (Node.js, npm,
# etc.) rather than replacing that detection entirely. Leaving it out —
# as the previous version of this file did — risks losing the
# auto-detected Node setup, not just failing to add ffmpeg correctly.
[phases.setup]
nixPkgs = ["...", "ffmpeg"]
