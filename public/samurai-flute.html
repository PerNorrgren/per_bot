<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deeper Mindfulness — Samurai Flute</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; font-family:'Georgia',serif; background:#0a0f0d; }
    body { display:flex; justify-content:center; }

    /* Same rotating backdrop as /samurai, so this reads as part of the
       same page, not a separate destination. */
    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.6); }
    .page { position:relative; z-index:2; width:100%; max-width:560px; padding:32px 20px 64px; }

    .wordmark { text-align:center; margin-bottom:20px; }
    .wordmark-main { font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.65); display:block; }
    .back-link { display:block; text-align:center; font-size:12px; color:rgba(180,230,200,0.75); text-decoration:none; margin-bottom:20px; }

    .hero { text-align:center; margin-bottom:28px; }
    .hero-title { font-size:32px; color:rgba(255,255,255,0.95); font-weight:normal; margin-bottom:12px; }
    .hero-sub { font-size:14px; line-height:1.8; color:rgba(255,255,255,0.68); max-width:460px; margin:0 auto; }

    .glass {
      background:rgba(255,255,255,0.07);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:24px 22px;
    }

    .now-playing { margin-bottom:20px; }
    .now-playing-label { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:8px; }
    .now-playing-title { font-size:16px; color:rgba(255,255,255,0.9); margin-bottom:12px; }
    .now-playing audio { width:100%; }

    .track-list { display:flex; flex-direction:column; }
    .track {
      display:flex; align-items:center; gap:14px; padding:13px 4px;
      border-top:1px solid rgba(255,255,255,0.08); cursor:pointer;
    }
    .track:first-child { border-top:none; }
    .track:hover .track-title { color:rgba(180,230,200,0.95); }
    .track.current { background:rgba(180,230,200,0.06); border-radius:8px; }
    .track-kanji { font-size:20px; color:rgba(180,230,200,0.85); width:34px; flex-shrink:0; text-align:center; }
    .track-info { flex:1; min-width:0; }
    .track-title { font-size:14.5px; color:rgba(255,255,255,0.85); transition:color 0.15s; }
    .track-virtue { font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-top:2px; }
    .track-icon { font-size:13px; color:rgba(255,255,255,0.35); flex-shrink:0; }

    .empty-note { text-align:center; font-size:14px; color:rgba(255,255,255,0.55); padding:24px 0; line-height:1.7; }

    @media (max-width: 500px) {
      .page { padding:24px 16px 48px; }
      .hero-title { font-size:26px; }
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>
  <div class="veil"></div>

  <div class="page">
    <div class="wordmark"><span class="wordmark-main" data-brand="name">Deeper Mindfulness</span></div>
    <a class="back-link" href="/samurai">← Back to The Modern Samurai</a>

    <div class="hero">
      <div class="hero-title">Samurai Flute</div>
      <div class="hero-sub">Every piece of music from the ten virtues, gathered into one quiet playlist. Play one, or let it carry through to the next.</div>
    </div>

    <div class="glass">
      <div class="now-playing" id="nowPlayingWrap" style="display:none">
        <div class="now-playing-label">Now Playing</div>
        <div class="now-playing-title" id="nowPlayingTitle"></div>
        <audio id="playlistAudio" controls></audio>
      </div>
      <div class="track-list" id="trackList"><div class="empty-note">Loading…</div></div>
    </div>
  </div>

  <script>
    const defaultSlides = [
      'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
      'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
      'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80',
      'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&q=80',
    ];
    window.brandReady.then(() => {
      const slides = (window.__skinBackgroundImages && window.__skinBackgroundImages.length) ? window.__skinBackgroundImages : defaultSlides;
      const ss = document.getElementById('slideshow');
      const slideEls = slides.map((url, i) => {
        const d = document.createElement('div');
        d.className = 'slide' + (i === 0 ? ' active' : '');
        d.style.backgroundImage = `url('${url}')`;
        ss.appendChild(d); return d;
      });
      let cur = 0;
      setInterval(() => {
        slideEls[cur].classList.remove('active');
        cur = (cur + 1) % slideEls.length;
        slideEls[cur].classList.add('active');
      }, 9000);
    });

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Same virtue labels as /samurai — just the kanji/romaji/english
    // needed to label each track, not the full teaser/history text.
    const VIRTUE_LABELS = {
      samurai1:  { kanji: '自制', romaji: 'Jisei',  english: 'Self-Mastery' },
      samurai2:  { kanji: '義',   romaji: 'Gi',     english: 'Rectitude' },
      samurai3:  { kanji: '勇',   romaji: 'Yu',     english: 'Courage' },
      samurai4:  { kanji: '仁',   romaji: 'Jin',    english: 'Benevolence' },
      samurai5:  { kanji: '礼',   romaji: 'Rei',    english: 'Respect' },
      samurai6:  { kanji: '誠',   romaji: 'Makoto', english: 'Sincerity' },
      samurai7:  { kanji: '名誉', romaji: 'Meiyo',  english: 'Honor' },
      samurai8:  { kanji: '忠義', romaji: 'Chugi',  english: 'Loyalty' },
      samurai9:  { kanji: '智',   romaji: 'Chi',    english: 'Wisdom' },
      samurai10: { kanji: '孝',   romaji: 'Ko',     english: 'Duty' },
      'modern samurai': { kanji: '侍', romaji: 'Samurai', english: 'Facing Yourself First' },
    };

    let tracks = [];
    let currentIndex = -1;
    const audio = document.getElementById('playlistAudio');

    async function fetchSignedUrl(id) {
      const res = await fetch(`/api/public/samurai-content/${id}/url`);
      const data = await res.json();
      if (!res.ok || !data.url) throw new Error(data.error || 'Could not load this track.');
      return data.url;
    }

    function renderTrackList() {
      const el = document.getElementById('trackList');
      if (!tracks.length) {
        el.innerHTML = '<div class="empty-note">No music uploaded yet — tracks tagged with a virtue and "music" in the Library will show up here.</div>';
        return;
      }
      el.innerHTML = tracks.map((t, i) => {
        const v = VIRTUE_LABELS[t.tag] || { kanji: '', romaji: t.tag, english: '' };
        return `
        <div class="track${i === currentIndex ? ' current' : ''}" onclick="playTrack(${i})">
          <div class="track-kanji">${v.kanji}</div>
          <div class="track-info">
            <div class="track-title">${escHtml(t.title)}</div>
            <div class="track-virtue">${v.romaji}${v.english ? ' — ' + v.english : ''}</div>
          </div>
          <div class="track-icon">${i === currentIndex ? '♪' : '▶'}</div>
        </div>`;
      }).join('');
    }

    // Per's request — playing one track carries through to the next
    // automatically, rather than stopping after each one; clicking a
    // specific track jumps straight there instead.
    async function playTrack(i) {
      if (i < 0 || i >= tracks.length) return;
      currentIndex = i;
      const t = tracks[i];
      document.getElementById('nowPlayingWrap').style.display = '';
      document.getElementById('nowPlayingTitle').textContent = t.title;
      renderTrackList();
      try {
        const url = await fetchSignedUrl(t.id);
        audio.src = url;
        audio.play().catch(() => {});
      } catch (e) { /* skip a track that fails to load rather than stall the whole playlist */ playNext(); }
    }
    function playNext() {
      if (currentIndex + 1 < tracks.length) playTrack(currentIndex + 1);
    }
    audio.addEventListener('ended', playNext);

    async function loadMusic() {
      try {
        tracks = await fetch('/api/public/samurai-music').then(r => r.json());
        renderTrackList();
      } catch (e) {
        document.getElementById('trackList').innerHTML = '<div class="empty-note">Could not load right now — please try again shortly.</div>';
      }
    }
    loadMusic();
  </script>
</body>
</html>
