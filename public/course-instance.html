<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course — Deeper Mindfulness</title>
  <!-- Per's request — SEO/sharing tags. These are the static fallback a
       social crawler actually sees (crawlers don't run JavaScript, so the
       per-course update further down only ever affects the browser tab
       someone's already looking at, not what shows up when this link is
       pasted into Slack/WhatsApp/etc. before they've clicked it). A
       properly personalized preview per course/instance/facilitator
       would need this page rendered server-side with the real data
       already in the HTML — a bigger change than adding meta tags,
       flagged rather than left looking finished when it isn't. -->
  <meta name="description" content="A course at Deeper Mindfulness — dates, facilitator, and how to join."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="A Course at Deeper Mindfulness"/>
  <meta property="og:description" content="See the schedule, meet the facilitator, and find out how to join."/>
  <meta name="twitter:card" content="summary"/>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; font-family:'Georgia',serif; background:#0a0f0d; display:flex; justify-content:center; padding:20px 16px 56px; }
    @media (max-width: 500px) { html, body { padding-left:0; padding-right:0; } }

    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.6); }

    .panel { position:relative; z-index:2; width:100%; max-width:640px; display:flex; flex-direction:column; gap:22px; padding-top:8px; }

    .back-link { display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,0.3); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; transition:color 0.2s; }
    .back-link:hover { color:rgba(180,230,200,0.7); }
    .back-link svg { width:14px; height:14px; }

    .page-wordmark { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(180,230,200,0.6); margin-bottom:6px; }
    .page-title { font-size:28px; color:rgba(255,255,255,0.92); font-weight:normal; margin-bottom:6px; }
    .page-subtitle { font-size:14px; color:rgba(255,255,255,0.4); }

    .card { background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; }
    .card h2 { font-size:15px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(180,230,200,0.6); font-weight:normal; margin-bottom:14px; }
    .card p { font-size:14px; color:rgba(255,255,255,0.6); line-height:1.8; }

    .meta-grid { display:flex; flex-direction:column; gap:12px; }
    .meta-row { display:flex; gap:14px; font-size:14px; }
    .meta-label { color:rgba(255,255,255,0.35); min-width:90px; flex-shrink:0; }
    .meta-value { color:rgba(255,255,255,0.75); }

    .facilitator-row { display:flex; align-items:center; gap:14px; text-decoration:none; padding:10px; border-radius:10px; transition:background 0.2s; }
    .facilitator-row:hover { background:rgba(255,255,255,0.04); }
    .facilitator-photo { width:52px; height:52px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.15); flex-shrink:0; background:rgba(255,255,255,0.08); }
    .facilitator-photo-placeholder { width:52px; height:52px; border-radius:50%; background:rgba(180,230,200,0.1); border:1px solid rgba(180,230,200,0.2); display:flex; align-items:center; justify-content:center; font-size:18px; color:rgba(180,230,200,0.6); flex-shrink:0; }
    .facilitator-name { font-size:15px; color:rgba(255,255,255,0.85); margin-bottom:2px; }
    .facilitator-credentials { font-size:12px; color:rgba(255,255,255,0.4); }

    .date-pick-row { display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:10px; cursor:pointer; transition:background 0.15s; }
    .date-pick-row:hover { background:rgba(255,255,255,0.04); }
    .date-pick-row input[type="radio"] { width:18px; height:18px; accent-color:rgba(180,230,200,0.85); cursor:pointer; flex-shrink:0; }
    .date-pick-label { font-size:14px; color:rgba(255,255,255,0.8); }
    .date-pick-sub { font-size:12px; color:rgba(255,255,255,0.4); margin-top:2px; }

    .cta-card { text-align:center; background:rgba(180,230,200,0.06); border:1px solid rgba(180,230,200,0.18); }
    .cta-card h2 { color:rgba(180,230,200,0.85); text-transform:none; letter-spacing:normal; font-size:18px; }
    .cta-btn { display:inline-block; margin-top:6px; padding:14px 28px; border-radius:10px; border:1px solid rgba(180,230,200,0.35); background:rgba(180,230,200,0.12); color:rgba(180,230,200,0.9); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; text-decoration:none; transition:all 0.2s; font-family:'Georgia',serif; }
    .cta-btn:hover { background:rgba(180,230,200,0.22); }

    .loading { text-align:center; padding:40px; font-size:13px; color:rgba(255,255,255,0.25); }
  </style>
</head>
<body>

<div class="slideshow" id="slideshow"></div>
<div class="veil"></div>

<div class="panel">

  <a class="back-link" href="/courses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    All courses
  </a>

  <div id="content" class="loading">Loading…</div>

</div>

<script>
  const slides = [
    'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
    'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
    'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
  ];
  const ss = document.getElementById('slideshow');
  const slideEls = slides.map((url, i) => {
    const d = document.createElement('div');
    d.className = 'slide' + (i === 0 ? ' active' : '');
    d.style.backgroundImage = `url('${url}')`;
    ss.appendChild(d); return d;
  });
  let cur = 0;
  setInterval(() => {
    slideEls[cur].classList.remove('active');
    cur = (cur + 1) % slideEls.length;
    slideEls[cur].classList.add('active');
  }, 9000);

  function fmtDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch(e) { return d; }
  }

  // Per App 31 — whichever instance the Register/Enrol action should
  // actually act on. Starts as whatever instance this URL loaded;
  // changes only if the visitor picks a different date from the
  // "Choose your start date" list below (real radio inputs, so "only one
  // sticks, picking another switches it" is just native browser
  // behaviour — no custom untick logic needed).
  let selectedInstanceId = null;

  function datePickRowLabel(inst) {
    const parts = [];
    if (inst.start_date) parts.push(fmtDate(inst.start_date));
    if (inst.schedule_day) parts.push(inst.schedule_day + (inst.schedule_time ? ', ' + inst.schedule_time : ''));
    return parts.join(' — ') || inst.title || 'Self-paced — start any time';
  }

  async function loadInstance() {
    const id = location.pathname.split('/').pop();
    selectedInstanceId = id;
    const el = document.getElementById('content');
    try {
      const res = await fetch(`/api/public/instances/${id}`);
      if (!res.ok) { el.innerHTML = '<div class="card"><p>This course could not be found — it may have been removed or is not yet public.</p></div>'; return; }
      const i = await res.json();
      document.title = `${i.title} — ${i.course_title} — Deeper Mindfulness`;
      // Updates the browser tab and anything reading the DOM after load —
      // not what a share-preview crawler sees (see the comment on the
      // static fallback tags in <head>), but still worth keeping
      // accurate for anyone actually on the page.
      const descText = `${i.title}, part of ${i.course_title}${i.schedule_day ? ' — meets ' + i.schedule_day : ''}${i.start_date ? ', starting ' + fmtDate(i.start_date) : ''}.`;
      document.querySelector('meta[name="description"]').setAttribute('content', descText);
      document.querySelector('meta[property="og:title"]').setAttribute('content', `${i.title} — ${i.course_title}`);
      document.querySelector('meta[property="og:description"]').setAttribute('content', descText);

      const facilitatorsHtml = (i.facilitators || []).length ? i.facilitators.map(f => `
        <a class="facilitator-row" href="/facilitators/${f.id}">
          ${f.photoUrl ? `<img class="facilitator-photo" src="${f.photoUrl}"/>` : '<div class="facilitator-photo-placeholder">🧑</div>'}
          <div>
            <div class="facilitator-name">${f.name}</div>
            ${f.credentials ? `<div class="facilitator-credentials">${f.credentials}</div>` : ''}
          </div>
        </a>
      `).join('') : '<p style="font-size:13px;color:rgba(255,255,255,0.35);font-style:italic">Facilitator details coming soon.</p>';

      // Per App 31 — if this course has more than one open cohort, offer
      // them all right here instead of the visitor needing a different
      // link per date. Only fetched/shown when there's genuinely a
      // choice to make — a single-instance course looks exactly as it
      // always did.
      let siblings = [];
      try {
        const sibRes = await fetch(`/api/public/courses/${i.course_id}/instances`);
        if (sibRes.ok) siblings = await sibRes.json();
      } catch (e) { /* picker just won't show — the single "When" card below still works fine */ }
      const showPicker = siblings.length > 1;
      if (showPicker && !siblings.some(s => s.id === id)) selectedInstanceId = siblings[0].id;

      const datePickerHtml = showPicker ? `
        <div class="card" style="margin-top:22px">
          <h2>Choose Your Start Date</h2>
          <div style="display:flex;flex-direction:column;gap:2px">
            ${siblings.map((s, idx) => `
              <label class="date-pick-row">
                <input type="radio" name="instancePick" value="${s.id}" ${s.id === selectedInstanceId ? 'checked' : ''} onchange="onInstancePicked('${s.id}')"/>
                <div>
                  <div class="date-pick-label">${datePickRowLabel(s)}</div>
                  ${s.price_cents ? `<div class="date-pick-sub">£${(s.price_cents / 100).toFixed(2)}</div>` : ''}
                </div>
              </label>
            `).join('')}
          </div>
        </div>
      ` : '';

      el.innerHTML = `
        <div>
          <div class="page-wordmark" data-brand="name">Deeper Mindfulness</div>
          <div class="page-title">${i.title}</div>
          <div class="page-subtitle">${i.course_title}</div>
          ${i.status === 'open' ? `<a class="cta-btn cta-register-btn" style="margin-top:16px;padding:11px 22px;font-size:12px" href="/register?instance=${selectedInstanceId}">Register</a>` : ''}
        </div>

        ${datePickerHtml}

        <div class="card" style="margin-top:22px">
          <h2>When</h2>
          <div class="meta-grid">
            ${i.schedule_day ? `<div class="meta-row"><div class="meta-label">Meets</div><div class="meta-value">${i.schedule_day}${i.schedule_time ? ', ' + i.schedule_time : ''}</div></div>` : ''}
            ${i.start_date ? `<div class="meta-row"><div class="meta-label">Starts</div><div class="meta-value">${fmtDate(i.start_date)}</div></div>` : ''}
            ${i.end_date ? `<div class="meta-row"><div class="meta-label">Ends</div><div class="meta-value">${fmtDate(i.end_date)}</div></div>` : ''}
            ${i.status === 'closed' ? `<div class="meta-row"><div class="meta-label">Status</div><div class="meta-value">This intake has closed — see the schedule for what's currently open.</div></div>` : ''}
          </div>
        </div>

        ${i.course_description ? `<div class="card"><h2>About This Course</h2><p>${i.course_description}</p>
          ${i.status === 'open' ? `<div style="text-align:center;margin-top:18px"><a class="cta-btn cta-register-btn" style="padding:11px 22px;font-size:12px" href="/register?instance=${selectedInstanceId}">Register</a></div>` : ''}
        </div>` : ''}

        <div class="card">
          <h2>Taught By</h2>
          <div style="display:flex;flex-direction:column;gap:4px">${facilitatorsHtml}</div>
        </div>

        ${i.status === 'open' ? `
        <div class="cta-card" id="ctaCard">
          <h2>Ready to Join?</h2>
          <p id="ctaText">Create an account to enrol — once you're registered, you'll find this course waiting for you in your library.</p>
          <a class="cta-btn cta-register-btn" id="ctaBtn" href="/register?instance=${selectedInstanceId}">Register</a>
        </div>` : ''}
      `;
      // Per's request — instance-aware registration. If the visitor is
      // already logged in (e.g. clicked this link from a reminder email
      // while signed in on this device), sending them through /register
      // would just fail with "an account already exists" — check first,
      // and if they're already a client, enrol them directly instead.
      if (i.status === 'open') checkAlreadyLoggedIn();
    } catch(e) {
      el.innerHTML = '<div class="card"><p>Something went wrong loading this course — please try again.</p></div>';
    }
  }
  // Per App 31 — flips which instance Register/Enrol act on, and keeps
  // every Register link's href in sync for anyone who hasn't logged in
  // (the logged-in Enrol path reads selectedInstanceId directly at click
  // time instead, see checkAlreadyLoggedIn below). Per's request added
  // two more Register buttons (top and middle of the page, previously
  // only the bottom one existed) — all three share the cta-register-btn
  // class now, so one picked date updates all of them, not just one.
  function onInstancePicked(id) {
    selectedInstanceId = id;
    document.querySelectorAll('.cta-register-btn').forEach(btn => {
      if (btn.hasAttribute('href')) btn.href = `/register?instance=${id}`;
    });
  }
  async function checkAlreadyLoggedIn() {
    try {
      const res = await fetch('/api/account');
      if (!res.ok) return; // not logged in, or logged in as facilitator/admin — leave the Register buttons as-is
      const text = document.getElementById('ctaText');
      if (text) text.textContent = "You're logged in — enrol below and you'll find this course in your library right away.";
      document.querySelectorAll('.cta-register-btn').forEach(btn => {
        btn.textContent = 'Enrol Now';
        btn.removeAttribute('href');
        btn.style.cursor = 'pointer';
        btn.onclick = async () => {
          document.querySelectorAll('.cta-register-btn').forEach(b => b.textContent = 'Enrolling…');
          try {
            // Per App 31 — reads whichever instance is currently selected
            // at the moment of the actual click, not whatever was loaded
            // when the page first rendered, so switching the date pick
            // above and then clicking Enrol acts on the one just chosen.
            const r = await fetch('/api/client/enrol', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ courseInstanceId: selectedInstanceId }) });
            const data = await r.json();
            if (data.requiresPayment) { location.href = data.checkoutUrl; return; }
            // Per's real bug, found and fixed while merging in the extra
            // Register buttons — this referenced an undefined
            // "instanceId" (this function's own parameter was removed
            // when it switched to reading selectedInstanceId, but this
            // one line was missed), which would have thrown the moment
            // a logged-in member actually completed enrolment here.
            if (data.ok) { location.href = `/client/?course=${selectedInstanceId}`; return; }
            if (text) text.textContent = data.error || 'Something went wrong — please try again.';
            document.querySelectorAll('.cta-register-btn').forEach(b => b.textContent = 'Enrol Now');
          } catch(e) {
            if (text) text.textContent = 'Something went wrong — please try again.';
            document.querySelectorAll('.cta-register-btn').forEach(b => b.textContent = 'Enrol Now');
          }
        };
      });
    } catch(e) { /* not logged in — leave the Register buttons as-is */ }
  }
  loadInstance();
</script>

<script>window.TOMTE_PAGE = 'Course Instance';</script>
<script src="/tomte-widget.js" defer></script>
</body>
</html>
