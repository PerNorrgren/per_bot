<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deeper Mindfulness</title>
<link rel="icon" href="/favicon-dynamic"/>
<link rel="apple-touch-icon" href="/favicon-dynamic"/>
<link rel="manifest" href="/site.webmanifest"/>
<script src="/brand-inject.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Georgia',serif; background:#0a0f0d; color:rgba(255,255,255,0.92); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:48px 20px 80px; }
  .wordmark { font-size:12px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(255,255,255,0.5); text-align:center; margin-bottom:36px; }
  .note { background:rgba(180,230,200,0.08); border:1px solid rgba(180,230,200,0.25); border-radius:14px; padding:20px 22px; font-size:15.5px; line-height:1.7; color:rgba(220,255,235,0.92); margin-bottom:28px; white-space:pre-wrap; }
  .motd-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:26px 24px; margin-bottom:34px; }
  .motd-eyebrow { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(180,230,200,0.7); margin-bottom:12px; }
  .motd-body { font-size:15.5px; line-height:1.85; color:rgba(255,255,255,0.82); white-space:pre-wrap; }
  .section-title { font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:16px; }
  .practice-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:22px 24px; margin-bottom:16px; }
  .practice-title { font-size:17px; color:rgba(255,255,255,0.92); margin-bottom:6px; }
  .practice-desc { font-size:13.5px; line-height:1.6; color:rgba(255,255,255,0.55); margin-bottom:16px; }
  audio, video { width:100%; }
  .play-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:9px; border:1px solid rgba(180,230,200,0.4); background:rgba(180,230,200,0.1); color:rgba(180,230,200,0.95); font-family:'Georgia',serif; font-size:14px; letter-spacing:0.02em; cursor:pointer; }
  .play-btn:hover { background:rgba(180,230,200,0.18); }
  .open-link { display:inline-block; padding:10px 20px; border-radius:9px; border:1px solid rgba(180,230,200,0.4); background:rgba(180,230,200,0.1); color:rgba(180,230,200,0.95); text-decoration:none; font-size:13px; letter-spacing:0.04em; }
  .status { text-align:center; padding:80px 20px; color:rgba(255,255,255,0.5); font-size:15px; }
  .app-note { text-align:center; margin-top:44px; font-size:12.5px; color:rgba(255,255,255,0.35); }
  .app-note a { color:rgba(180,230,200,0.8); }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="wordmark" data-brand="name">Deeper Mindfulness</div>
    <div class="status" id="status">Loading…</div>
  </div>

<script>
  // Per's request — a page for someone who just needs one or two
  // practices, no login. The token in the URL is the entire access
  // control (see GET /api/share/:token) — this page itself trusts
  // nothing else about the visitor.
  const token = new URLSearchParams(location.search).get('t');
  function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  async function load() {
    const statusEl = document.getElementById('status');
    if (!token) { statusEl.textContent = 'This link is missing something — please ask for a new one.'; return; }
    let data;
    try {
      const res = await fetch(`/api/share/${encodeURIComponent(token)}`);
      data = await res.json();
      if (!res.ok) throw new Error(data.error || 'not found');
    } catch (e) {
      statusEl.textContent = 'This link isn\u2019t recognised — please ask for a new one.';
      return;
    }
    render(data);
  }

  function render(data) {
    const parts = [];
    if (data.note) parts.push(`<div class="note">${escHtml(data.note)}</div>`);
    if (data.motd) parts.push(`
      <div class="motd-card">
        <div class="motd-eyebrow">Today</div>
        <div class="motd-body">${escHtml(data.motd)}</div>
      </div>`);
    if (data.files && data.files.length) {
      parts.push('<div class="section-title">For you</div>');
      data.files.forEach(f => { parts.push(practiceCardHtml(f)); });
    } else {
      parts.push('<div class="status" style="padding:20px 0">Nothing here yet.</div>');
    }
    parts.push(`<div class="app-note">Part of the Deeper Mindfulness app \u2014 <a href="/register">explore more</a></div>`);
    document.getElementById('wrap').innerHTML = `<div class="wordmark" data-brand="name">Deeper Mindfulness</div>` + parts.join('');
  }

  function practiceCardHtml(f) {
    const isAudio = f.file_type && f.file_type.startsWith('audio');
    const isVideo = f.file_type && f.file_type.startsWith('video');
    const isPlayable = isAudio || isVideo;
    return `
      <div class="practice-card">
        <div class="practice-title">${escHtml(f.title)}</div>
        ${f.description ? `<div class="practice-desc">${escHtml(f.description)}</div>` : ''}
        <div id="player-wrap-${f.id}">
          ${isPlayable
            ? `<button type="button" class="play-btn" onclick="loadPlayer('${f.id}', ${isAudio})">\u25b6 Play</button>`
            : `<a class="open-link" href="#" onclick="openOther('${f.id}');return false;">Open</a>`}
        </div>
      </div>`;
  }

  // The actual signed R2 URL is only fetched (and the play only logged
  // server-side) the first time someone presses Play — not the moment
  // the page loads, so just opening the link doesn't itself count as a
  // "use". A real <button> here rather than a click-catching wrapper
  // around the native <audio controls> element — a click on that
  // element's own internal play button doesn't reliably bubble to an
  // ancestor the way a normal element's click does, so the old version
  // could sit there doing nothing when pressed. This fetches first, THEN
  // hands the browser a real, already-sourced player.
  async function loadPlayer(fileId, isAudio) {
    const wrap = document.getElementById(`player-wrap-${fileId}`);
    wrap.innerHTML = '<div style="font-size:13px;color:rgba(255,255,255,0.5)">Loading\u2026</div>';
    try {
      const res = await fetch(`/api/share/${encodeURIComponent(token)}/files/${fileId}/playback-url`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      const tag = isAudio ? 'audio' : 'video';
      wrap.innerHTML = `<${tag} controls autoplay src="${escAttr(data.url)}"></${tag}>`;
    } catch (e) {
      wrap.innerHTML = '<div style="font-size:13px;color:rgba(230,140,120,0.8)">Could not load this \u2014 please try again.</div>';
    }
  }
  async function openOther(fileId) {
    try {
      const res = await fetch(`/api/share/${encodeURIComponent(token)}/files/${fileId}/playback-url`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      window.open(data.url, '_blank');
    } catch (e) { /* silent — nothing sensible to show inline here */ }
  }

  load();
</script>
</body>
</html>
