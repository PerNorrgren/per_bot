<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset password — Deeper Mindfulness</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; font-family:'Georgia',serif; background:#0a0f0d; display:flex; align-items:center; justify-content:center; }

    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.5); }

    .panel { position:relative; z-index:2; width:100%; max-width:380px; padding:20px; }

    .glass {
      background:rgba(255,255,255,0.07);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:40px 36px 36px;
      display:flex; flex-direction:column; gap:24px;
    }

    /* Per's request — same edge-to-edge treatment as the main app: no
       outer margin on phone-width screens. Width only, not height — see
       login.html for why. */
    @media (max-width: 500px) {
      .panel { max-width:100%; padding:0; }
      .glass { border-radius:0; }
    }

    .wordmark { text-align:center; }
    .wordmark-main { font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.4); display:block; }
    .wordmark-sub { font-size:20px; color:rgba(255,255,255,0.8); display:block; margin-top:6px; }

    .form { display:flex; flex-direction:column; gap:14px; }

    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
    .field input {
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
      border-radius:10px; padding:12px 14px; font-size:15px;
      color:rgba(255,255,255,0.85); font-family:'Georgia',serif; outline:none;
      transition:border-color 0.2s;
    }
    .field input:focus { border-color:rgba(180,230,200,0.4); }
    .field input::placeholder { color:rgba(255,255,255,0.2); }

    .error   { font-size:13px; color:rgba(255,140,120,0.85); text-align:center; min-height:18px; }
    .success { font-size:13px; color:rgba(180,230,200,0.85); text-align:center; }

    .submit-btn {
      width:100%; padding:13px; border-radius:10px;
      border:1px solid rgba(180,230,200,0.3);
      background:rgba(180,230,200,0.1);
      color:rgba(180,230,200,0.85); font-size:13px;
      letter-spacing:0.12em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s; font-family:'Georgia',serif;
    }
    .submit-btn:hover { background:rgba(180,230,200,0.18); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }

    .footer-note { text-align:center; font-size:11px; color:rgba(255,255,255,0.2); }
    .back-link { color:rgba(180,230,200,0.5); text-decoration:none; font-size:12px; }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>
  <div class="veil"></div>

  <div class="panel">
    <div class="glass">
      <div class="wordmark">
        <span class="wordmark-main" data-brand="name">Deeper Mindfulness</span>
        <span class="wordmark-sub" id="headline">Choose a new password</span>
      </div>

      <div class="form" id="formArea">
        <div class="field">
          <label>New password</label>
          <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="password2" placeholder="Same password again" autocomplete="new-password"/>
        </div>
        <div class="error" id="error"></div>
        <button class="submit-btn" id="submitBtn" onclick="doReset()">Set new password</button>
      </div>

      <div class="footer-note">
        <a class="back-link" href="/login">Back to sign in</a>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
      'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
      'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80',
      'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&q=80',
    ];
    const ss = document.getElementById('slideshow');
    const slideEls = slides.map((url, i) => {
      const d = document.createElement('div');
      d.className = 'slide' + (i === 0 ? ' active' : '');
      d.style.backgroundImage = `url('${url}')`;
      ss.appendChild(d); return d;
    });
    let cur = 0;
    setInterval(() => {
      slideEls[cur].classList.remove('active');
      cur = (cur + 1) % slideEls.length;
      slideEls[cur].classList.add('active');
    }, 9000);

    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      document.getElementById('headline').textContent = 'Missing reset link';
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('error').textContent = 'This page needs a reset link from your email — request a new one from the login page.';
    }

    async function doReset() {
      const password  = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const btn       = document.getElementById('submitBtn');
      const errorEl   = document.getElementById('error');
      errorEl.textContent = '';

      if (password.length < 8) { errorEl.textContent = 'Password must be at least 8 characters.'; return; }
      if (password !== password2) { errorEl.textContent = 'Passwords don\u2019t match.'; return; }

      btn.disabled = true;
      btn.textContent = 'Saving\u2026';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (data.ok) {
          // Per Bot 24 — the backend now signs the person in directly on
          // a successful reset (see server.js), so this goes straight
          // into the app instead of back to /login, where they'd have
          // had to type their email and their brand-new password again
          // immediately after just setting it.
          if (data.loggedIn && data.redirect) {
            document.getElementById('formArea').innerHTML = '<div class="success">Password updated \u2014 you\u2019re signed in.</div>';
            setTimeout(() => { window.location.href = data.redirect; }, 900);
          } else {
            document.getElementById('formArea').innerHTML = '<div class="success">Password updated. Redirecting to sign in\u2026</div>';
            setTimeout(() => { window.location.href = '/login'; }, 1800);
          }
        } else {
          errorEl.textContent = data.error || 'Something went wrong.';
          btn.disabled = false;
          btn.textContent = 'Set new password';
        }
      } catch(e) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    }
  </script>

<script>window.TOMTE_PAGE = 'Reset Password';</script>
<script src="/tomte-widget.js" defer></script>
</body>
</html>
