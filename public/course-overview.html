<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course — Deeper Mindfulness</title>
  <!-- Per's request — see course-instance.html's identical comment: these
       are the static fallback a crawler actually sees, since crawlers
       don't run the JavaScript that personalizes the browser tab below. -->
  <meta name="description" content="A course at Deeper Mindfulness."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="A Course at Deeper Mindfulness"/>
  <meta property="og:description" content="Practices that land and last, taught live, in a group."/>
  <meta name="twitter:card" content="summary"/>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; font-family:'Georgia',serif; background:#0a0f0d; display:flex; justify-content:center; padding:20px 16px 56px; }
    @media (max-width: 500px) { html, body { padding-left:0; padding-right:0; } }

    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.6); }

    .panel { position:relative; z-index:2; width:100%; max-width:640px; display:flex; flex-direction:column; gap:22px; padding-top:8px; }

    .back-link { display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,0.3); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; transition:color 0.2s; }
    .back-link:hover { color:rgba(180,230,200,0.7); }
    .back-link svg { width:14px; height:14px; }

    .page-wordmark { font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:6px; }
    .page-title { font-size:30px; color:rgba(255,255,255,0.92); font-weight:normal; margin-bottom:10px; }
    .page-desc { font-size:15px; color:rgba(255,255,255,0.55); line-height:1.8; }

    .card { background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; }
    .card h2 { font-size:15px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(180,230,200,0.6); font-weight:normal; margin-bottom:14px; }

    .instance-card { display:block; text-decoration:none; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:16px 18px; margin-bottom:10px; transition:border-color 0.2s, background 0.2s; }
    .instance-card:last-child { margin-bottom:0; }
    .instance-card:hover { border-color:rgba(180,230,200,0.3); background:rgba(255,255,255,0.06); }
    .instance-card-title { font-size:15px; color:rgba(255,255,255,0.85); margin-bottom:6px; }
    .instance-card-meta { font-size:12.5px; color:rgba(255,255,255,0.45); }

    .empty-note { font-size:13px; color:rgba(255,255,255,0.35); font-style:italic; }

    .loading { text-align:center; padding:40px; font-size:13px; color:rgba(255,255,255,0.25); }
  </style>
</head>
<body>

<div class="slideshow" id="slideshow"></div>
<div class="veil"></div>

<div class="panel">

  <a class="back-link" href="/courses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    All courses
  </a>

  <div id="content" class="loading">Loading…</div>

</div>

<script>
  const slides = [
    'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
    'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
    'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
  ];
  const ss = document.getElementById('slideshow');
  const slideEls = slides.map((url, i) => {
    const d = document.createElement('div');
    d.className = 'slide' + (i === 0 ? ' active' : '');
    d.style.backgroundImage = `url('${url}')`;
    ss.appendChild(d); return d;
  });
  let cur = 0;
  setInterval(() => {
    slideEls[cur].classList.remove('active');
    cur = (cur + 1) % slideEls.length;
    slideEls[cur].classList.add('active');
  }, 9000);

  function fmtDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch(e) { return d; }
  }

  async function loadCourse() {
    const id = location.pathname.split('/').pop();
    const el = document.getElementById('content');
    try {
      const [courseRes, scheduleRes] = await Promise.all([
        fetch(`/api/public/courses/${id}`),
        fetch('/api/public/schedule'),
      ]);
      if (!courseRes.ok) { el.innerHTML = '<div class="card"><p style="font-size:14px;color:rgba(255,255,255,0.6)">This course could not be found.</p></div>'; return; }
      const course = await courseRes.json();
      const schedule = await scheduleRes.json();
      const instances = (Array.isArray(schedule) ? schedule : []).filter(i => i.course_id === id);
      document.title = `${course.title} — Deeper Mindfulness`;
      if (course.description) {
        const plain = course.description.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
        document.querySelector('meta[name="description"]').setAttribute('content', plain);
        document.querySelector('meta[property="og:description"]').setAttribute('content', plain);
      }
      document.querySelector('meta[property="og:title"]').setAttribute('content', course.title);

      const instancesHtml = instances.length ? instances.map(i => `
        <a class="instance-card" href="/course-instance/${i.id}">
          <div class="instance-card-title">${i.instance_title}</div>
          <div class="instance-card-meta">${i.schedule_day ? i.schedule_day + (i.schedule_time ? ', ' + i.schedule_time : '') : ''}${i.start_date ? ' · Starts ' + fmtDate(i.start_date) : ''}${i.facilitator_names ? ' · With ' + i.facilitator_names : ''}</div>
        </a>
      `).join('') : '<div class="empty-note">Nothing currently open — check back soon, or see the full schedule for other courses.</div>';

      el.innerHTML = `
        <div>
          <div class="page-wordmark" data-brand="name">Deeper Mindfulness</div>
          <div class="page-title">${course.title}</div>
          ${course.description ? `<div class="page-desc">${course.description}</div>` : ''}
        </div>
        <div class="card">
          <h2>Open Now</h2>
          ${instancesHtml}
        </div>
      `;
    } catch(e) {
      el.innerHTML = '<div class="card"><p style="font-size:14px;color:rgba(255,255,255,0.6)">Something went wrong loading this course — please try again.</p></div>';
    }
  }
  loadCourse();
</script>

<script>window.TOMTE_PAGE = 'Course Overview';</script>
<script src="/tomte-widget.js" defer></script>
</body>
</html>
