<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deeper Mindfulness — The Modern Samurai</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; font-family:'Georgia',serif; background:#0a0f0d; }
    body { display:flex; justify-content:center; }

    /* Per's request — "backdrop as the app": same rotating slideshow
       used on register.html/course-instance.html, not a one-off image,
       so this page genuinely feels like part of the same site. */
    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.55); }
    .page { position:relative; z-index:2; width:100%; max-width:640px; padding:32px 20px 64px; }

    .wordmark { text-align:center; margin-bottom:28px; }
    .wordmark-main { font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.65); display:block; }

    .hero { text-align:center; margin-bottom:32px; }
    .hero-title { font-size:34px; color:rgba(255,255,255,0.95); font-weight:normal; margin-bottom:14px; }
    .hero-sub { font-size:15px; line-height:1.8; color:rgba(255,255,255,0.7); max-width:520px; margin:0 auto; }

    /* Per's report — the source image can't be used here (another
       page's own branding/watermark baked directly into it, not
       something Per has the rights to publish). Placeholder note left
       here on purpose rather than silently leaving the space empty —
       easy to swap in real art once Per has something properly
       licensed. */
    .image-note { text-align:center; font-size:12px; color:rgba(255,255,255,0.35); font-style:italic; margin-bottom:32px; padding:14px; border:1px dashed rgba(255,255,255,0.15); border-radius:12px; }

    .glass {
      background:rgba(255,255,255,0.07);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:28px 24px;
    }
    .content-label { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:18px; }

    .item { padding:16px 0; border-top:1px solid rgba(255,255,255,0.08); }
    .item:first-child { border-top:none; padding-top:0; }
    .item-title { font-size:16px; color:rgba(255,255,255,0.9); margin-bottom:4px; }
    .item-desc { font-size:13px; color:rgba(255,255,255,0.55); line-height:1.6; margin-bottom:10px; }
    .item-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .item-btn {
      font-family:'Georgia',serif; font-size:12px; letter-spacing:0.05em;
      padding:8px 16px; border-radius:8px; cursor:pointer; text-decoration:none;
      border:1px solid rgba(180,230,200,0.35); color:rgba(180,230,200,0.9); background:rgba(180,230,200,0.08);
      transition:background 0.2s;
    }
    .item-btn:hover { background:rgba(180,230,200,0.16); }
    .item-btn.secondary { border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.6); background:none; }
    .item-audio { width:100%; margin-top:10px; display:none; }

    .empty-note { text-align:center; font-size:14px; color:rgba(255,255,255,0.5); padding:20px 0; }

    .cta-wrap { text-align:center; margin-top:36px; }
    .cta-btn {
      display:inline-block; font-family:'Georgia',serif; font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
      padding:14px 36px; border-radius:10px; border:1px solid rgba(180,230,200,0.4);
      background:rgba(180,230,200,0.12); color:rgba(180,230,200,0.95); text-decoration:none;
    }

    @media (max-width: 500px) {
      .page { padding:24px 16px 48px; }
      .hero-title { font-size:28px; }
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>
  <div class="veil"></div>

  <div class="page">
    <div class="wordmark"><span class="wordmark-main" data-brand="name">Deeper Mindfulness</span></div>

    <div class="hero">
      <div class="hero-title">The Modern Samurai</div>
      <div class="hero-sub">Before you fight the world, face yourself first. Patience. Clarity. Courage. Three things, in order — each one can be trained.</div>
    </div>

    <div class="image-note">Artwork for this page is still being sourced properly — nothing shown here yet.</div>

    <div class="glass">
      <div class="content-label">Practices &amp; Reading</div>
      <div id="itemsList"><div class="empty-note">Loading…</div></div>
    </div>

    <div class="cta-wrap">
      <a class="cta-btn" href="/" id="findOutMoreBtn">Find out more</a>
    </div>
  </div>

  <script>
    const defaultSlides = [
      'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
      'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
      'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80',
      'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&q=80',
    ];
    window.brandReady.then(() => {
      const slides = (window.__skinBackgroundImages && window.__skinBackgroundImages.length) ? window.__skinBackgroundImages : defaultSlides;
      const ss = document.getElementById('slideshow');
      const slideEls = slides.map((url, i) => {
        const d = document.createElement('div');
        d.className = 'slide' + (i === 0 ? ' active' : '');
        d.style.backgroundImage = `url('${url}')`;
        ss.appendChild(d); return d;
      });
      let cur = 0;
      setInterval(() => {
        slideEls[cur].classList.remove('active');
        cur = (cur + 1) % slideEls.length;
        slideEls[cur].classList.add('active');
      }, 9000);
    });

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    const audioTypes = ['audio/mpeg', 'audio/mp4', 'audio/wav', 'audio/x-m4a', 'audio/aac'];

    async function fetchSignedUrl(id) {
      const res = await fetch(`/api/public/samurai-content/${id}/url`);
      const data = await res.json();
      if (!res.ok || !data.url) throw new Error(data.error || 'Could not load this file.');
      return data.url;
    }

    // Per's request — Listen for audio (inline native player, so no one
    // has to leave the page just to hear it), Read for anything else
    // (opens in a new tab — the browser's own PDF/text viewer handles
    // it), and a separate Download on every item. URLs are fetched
    // fresh on click rather than upfront — R2's signed URLs expire in
    // 10 minutes, and someone browsing this page a while before
    // clicking would otherwise hit a dead link.
    async function listenOrRead(id, isAudio, btn) {
      const original = btn.textContent;
      btn.textContent = '…';
      try {
        const url = await fetchSignedUrl(id);
        if (isAudio) {
          const audioEl = document.getElementById('audio-' + id);
          audioEl.src = url;
          audioEl.style.display = 'block';
          audioEl.play().catch(() => {});
        } else {
          window.open(url, '_blank');
        }
      } catch (e) { alert(e.message); }
      btn.textContent = original;
    }
    async function downloadItem(id, title, btn) {
      const original = btn.textContent;
      btn.textContent = '…';
      try {
        const url = await fetchSignedUrl(id);
        const a = document.createElement('a');
        a.href = url;
        a.download = title || 'download';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) { alert(e.message); }
      btn.textContent = original;
    }

    async function loadContent() {
      const el = document.getElementById('itemsList');
      try {
        const items = await fetch('/api/public/samurai-content').then(r => r.json());
        if (!items.length) { el.innerHTML = '<div class="empty-note">Nothing here yet — check back soon.</div>'; return; }
        el.innerHTML = items.map(f => {
          const isAudio = audioTypes.includes(f.file_type) || f.content_type === 'meditation' || f.content_type === 'practice';
          return `
          <div class="item">
            <div class="item-title">${escHtml(f.title)}</div>
            ${f.description ? `<div class="item-desc">${escHtml(f.description)}</div>` : ''}
            <div class="item-actions">
              <button class="item-btn" onclick="listenOrRead('${f.id}', ${isAudio}, this)">${isAudio ? 'Listen' : 'Read'}</button>
              <button class="item-btn secondary" onclick="downloadItem('${f.id}', '${escHtml(f.title).replace(/'/g,"\\'")}', this)">Download</button>
            </div>
            ${isAudio ? `<audio class="item-audio" id="audio-${f.id}" controls></audio>` : ''}
          </div>`;
        }).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty-note">Could not load right now — please try again shortly.</div>';
      }
    }
    loadContent();
  </script>
</body>
</html>
