<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — Admin · Deeper Mindfulness</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <script src="/js/dialogs.js"></script>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; font-family:'Georgia',serif; background:#0d1210; color:rgba(255,255,255,0.82); overflow-y:auto; }

    .topbar { padding:14px 28px 12px; background:#0d1210; border-bottom:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; align-items:stretch; gap:10px; position:sticky; top:0; z-index:10; }
    /* Per Bot 24 — two-row header: the logo/account row and the section
       nav row used to share one horizontal line, cramming every nav
       button to the far right. flex-direction:column above is the whole
       fix — the two existing children (logo block, .topbar-right) simply
       stack instead of sitting side by side, no markup changes needed. */
    .logo { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
    .logo-name { font-size:18px; color:rgba(255,255,255,0.78); }
    .topbar-right { display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; justify-content:flex-start; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); }
    .btn { padding:7px 16px; border-radius:7px; border:1px solid rgba(255,255,255,0.12); background:none; color:rgba(255,255,255,0.5); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; font-family:'Georgia',serif; text-decoration:none; display:inline-flex; align-items:center; transition:all 0.2s; }
    .btn:hover { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.8); }
    .btn.primary { border-color:rgba(180,230,200,0.35); color:rgba(180,230,200,0.75); }
    .btn.primary:hover { background:rgba(180,230,200,0.1); }
    .nav-badge { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:rgba(220,80,70,0.92); color:#fff; font-size:10px; font-weight:bold; margin-left:5px; line-height:1; vertical-align:middle; }

    .page { max-width:1040px; margin:0 auto; padding:32px 28px; display:flex; flex-direction:column; gap:28px; }
    .section-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:14px; }

    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden; }
    .card-header { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:space-between; }
    .card-title { font-size:14px; color:rgba(255,255,255,0.75); }

    /* Report picker — grouped by category, button-per-report rather than
       a sidebar, consistent with how the rest of the admin panel favours
       flat button rows over nested navigation. */
    .report-group { margin-bottom:16px; }
    .report-group:last-child { margin-bottom:0; }
    .report-group-label { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.25); margin-bottom:8px; }
    .report-btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    .report-btn { padding:9px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.6); font-size:13px; font-family:'Georgia',serif; cursor:pointer; transition:all 0.15s; }
    .report-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.85); }
    .report-btn.active { background:rgba(180,230,200,0.1); border-color:rgba(180,230,200,0.4); color:rgba(180,230,200,0.85); }

    .tiles { display:flex; flex-wrap:wrap; gap:14px; padding:20px; }
    .tile { flex:1 1 150px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:16px 18px; }
    .tile-value { font-size:26px; color:rgba(180,230,200,0.9); line-height:1.1; }
    .tile-label { font-size:11px; color:rgba(255,255,255,0.4); margin-top:6px; letter-spacing:0.02em; }

    .table { width:100%; max-height:420px; overflow-y:auto; }
    .report-table-row { display:flex; align-items:center; padding:11px 20px; border-bottom:1px solid rgba(255,255,255,0.04); gap:14px; font-size:13px; }
    .report-table-row:last-child { border-bottom:none; }
    .report-table-row > div { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,0.6); }
    .report-table-hdr { display:flex; align-items:center; padding:8px 20px; gap:14px; border-bottom:1px solid rgba(255,255,255,0.06); background:#141a17; position:sticky; top:0; }
    .report-table-hdr > div { flex:1; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.25); }

    .report-note { padding:14px 20px; font-size:12px; color:rgba(255,255,255,0.35); font-style:italic; border-top:1px solid rgba(255,255,255,0.05); }
    .empty { padding:28px 20px; font-size:13px; color:rgba(255,255,255,0.25); font-style:italic; }
    .loading { padding:28px 20px; font-size:13px; color:rgba(255,255,255,0.2); font-style:italic; }

    /* Per Bot 22 — this page had no modals at all before the Email Log's
       job-content/job-log drill-downs; same convention as every other
       admin page (openModal/closeModal toggling .open). */
    .modal-overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.72); backdrop-filter:blur(8px); align-items:flex-start; justify-content:center; padding:32px 20px; overflow-y:auto; }
    .modal-overlay.open { display:flex; }
    .modal { background:#131a17; border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px; width:100%; max-width:640px; margin:auto; display:flex; flex-direction:column; gap:14px; }
    .modal h3 { font-size:16px; font-weight:normal; color:rgba(255,255,255,0.85); }
    .modal-btns { display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
    .modal-cancel { padding:9px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:none; color:rgba(255,255,255,0.6); font-family:Georgia,serif; font-size:13px; cursor:pointer; }
    .btn.sm { padding:5px 12px; font-size:10px; }
</style>
</head>
<body>
  <div class="topbar">
    <div style="position:relative">
      <div class="logo" data-brand="name">Deeper Mindfulness</div>
      <button onclick="toggleAdminMenu()" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0;margin-top:2px">
        <span class="logo-name" style="font-size:18px">Reports</span>
        <span style="color:rgba(255,255,255,0.3);font-size:11px">▾</span>
      </button>
      <div id="adminMenu" style="display:none;position:absolute;top:100%;left:0;background:#1a2420;border:1px solid rgba(255,255,255,0.1);border-radius:0 0 10px 10px;z-index:50;min-width:160px;overflow:hidden">
        <a href="/account" style="display:block;width:100%;padding:11px 16px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:13px;font-family:Georgia,serif;cursor:pointer;text-align:left;text-decoration:none;box-sizing:border-box">My account</a>
        <button onclick="logout()" style="width:100%;padding:11px 16px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:13px;font-family:Georgia,serif;cursor:pointer;text-align:left">Sign out</button>
      </div>
    </div>
    <div class="topbar-right">
      <span id="a11yMenuSlot" style="position:relative"></span>
      <a href="/admin/" class="btn" style="position:relative">People<span id="peopleNavBadge" class="nav-badge" style="display:none"></span></a>
      <a href="/admin/content" class="btn">Content</a>
      <a href="/admin/talk" class="btn">Talk &amp; Tomte</a>
      <a href="/admin/comms" class="btn">Communications</a>
      <a href="/admin/comms2" class="btn" style="color:rgba(180,230,200,0.8)">Comms 2</a>
      <a href="/admin/sales" class="btn">Sales &amp; Marketing</a>
      <a href="/admin/reports" class="btn primary">Reports</a>
      <a href="/setup" class="btn">Settings</a>
    </div>
  </div>

  <div class="page">

    <div>
      <div class="section-label">Reports</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Choose a report</div>
        </div>
        <div style="padding:18px 20px" id="reportPicker">
          <div class="loading">Loading…</div>
        </div>
      </div>
    </div>

    <div id="reportDetailSection" style="display:none">
      <div class="section-label" id="reportDetailLabel"></div>
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="reportDetailTitle"></div>
          <button class="btn sm" onclick="loadReport(_currentReportId)">Refresh</button>
        </div>
        <div class="tiles" id="reportTiles"></div>
        <div class="table" id="reportTable"></div>
        <div class="report-note" id="reportNote" style="display:none"></div>
      </div>
    </div>

  </div>

  <!-- Per Bot 22 — Email Log job drill-downs. Content modal shows the
       actual stored HTML for a representative email in the job (safe to
       render directly — our own templates, admin-only page, same
       convention as the newsletter preview in Communications). Log modal
       shows every recipient row for that job, each failed one with an
       Error toggle rather than a third nested modal. -->
  <div class="modal-overlay" id="emailJobContentModal" onclick="if(event.target===this)closeModal('emailJobContentModal')">
    <div class="modal">
      <h3 id="emailJobContentTitle"></h3>
      <div id="emailJobContentBody" style="background:#f5f5f0;border-radius:10px;max-height:60vh;overflow-y:auto;color:#2a2a2a"></div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal('emailJobContentModal')">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="emailJobLogModal" onclick="if(event.target===this)closeModal('emailJobLogModal')">
    <div class="modal" style="max-width:720px">
      <h3 id="emailJobLogTitle"></h3>
      <div id="emailJobLogRows" style="max-height:60vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:10px"></div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal('emailJobLogModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Per Bot 22 — Generated Images report: click a thumbnail to view
       full size here. -->
  <div class="modal-overlay" id="imageViewModal" onclick="if(event.target===this)closeModal('imageViewModal')">
    <div class="modal" style="max-width:600px">
      <h3 id="imageViewTitle"></h3>
      <div style="background:#f5f5f0;border-radius:10px;padding:14px;max-height:70vh;overflow-y:auto">
        <img id="imageViewImg" src="" style="width:100%;display:block;border-radius:4px"/>
      </div>
      <div class="modal-btns">
        <button class="btn sm" id="copyImageBtn" onclick="copyImageToClipboard()">Copy image</button>
        <button class="modal-cancel" onclick="closeModal('imageViewModal')">Close</button>
      </div>
    </div>
  </div>

<script>

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  async function logout()  { await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function toggleAdminMenu() {
    const m = document.getElementById('adminMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const m = document.getElementById('adminMenu');
    if (m && !e.target.closest('.topbar')) m.style.display = 'none';
  });

  async function loadPeopleNavBadge() {
    try {
      const res = await fetch('/api/admin/notification-counts');
      const data = await res.json();
      const total = (data.pendingFacilitatorRequests||0) + (data.unseenEnquiries||0);
      const badge = document.getElementById('peopleNavBadge');
      if (!badge) return;
      if (total > 0) { badge.textContent = total > 9 ? '9+' : total; badge.style.display = 'inline-flex'; }
      else { badge.style.display = 'none'; }
    } catch(e) { /* quiet -- decorative */ }
  }
  loadPeopleNavBadge();

  // ── Reports hub ──
  // Per Bot 20 — a genuine framework: this page has no report-specific
  // logic at all. It fetches the list of registered reports from the
  // server, renders one button per report grouped by category, and
  // renders whatever shape { tiles, table, note } comes back for
  // whichever one is selected. Adding a new report later never touches
  // this file — it's a new function in db.js plus one line in server.js's
  // REPORTS registry.
  let _reports = [];
  let _currentReportId = null;

  // Per Bot 22 — Email Log's jobs view. One row per send action (see
  // db.getEmailJobs) rather than one row per recipient — click a row for
  // the message content, click Log for the per-recipient breakdown.
  let _currentJobs = [];
  function renderEmailLogReport(jobs) {
    _currentJobs = jobs;
    const el = document.getElementById('reportTable');
    if (!jobs.length) { el.innerHTML = '<div class="empty">No email activity yet.</div>'; return; }
    el.innerHTML =
      `<div class="report-table-hdr">
        <div>Sent at</div><div>Audience</div><div>Subject</div><div>Kind</div><div>Status</div><div style="flex:0 0 70px"></div>
      </div>` +
      jobs.map((j, i) => {
        const audience = j.total > 1 ? `${j.total} recipients` : (j.sole_email || '—');
        const statusBits = [
          j.sent ? `<span style="color:rgba(180,230,200,0.85)">${j.sent} sent</span>` : '',
          j.failed ? `<span style="color:rgba(230,140,120,0.9)">${j.failed} failed</span>` : '',
          j.pending ? `<span style="color:rgba(230,200,120,0.9)">${j.pending} pending</span>` : '',
        ].filter(Boolean).join(' · ') || '—';
        return `<div class="report-table-row" style="cursor:pointer" onclick="openEmailJobContent(${i})">
          <div title="${escHtml(j.first_at)}">${escHtml(j.first_at)}</div>
          <div title="${escHtml(audience)}">${escHtml(audience)}</div>
          <div title="${escHtml(j.subject || '—')}">${escHtml(j.subject || '—')}</div>
          <div>${escHtml(j.kind)}</div>
          <div style="overflow:visible;text-overflow:clip;white-space:normal">${statusBits}</div>
          <div style="flex:0 0 70px;text-align:right" onclick="event.stopPropagation()">
            <button class="btn sm" onclick="openEmailJobLog(${i})">Log</button>
          </div>
        </div>`;
      }).join('');
  }

  // Per Bot 22 — Generated Images: the sumi-e image generator's history.
  // A thumbnail grid with a size control, click one to view it full size.
  let _currentImages = [];
  // Persisted across visits — a real webpage, not a sandboxed artifact,
  // so localStorage is fine here (unlike in Claude-generated artifacts,
  // where it isn't supported).
  const IMAGE_GRID_SIZES = { small: 80, medium: 120, large: 180 };
  function getImageGridSize() {
    return IMAGE_GRID_SIZES[localStorage.getItem('genImagesGridSize')] ? localStorage.getItem('genImagesGridSize') : 'medium';
  }
  function setImageGridSize(size) {
    localStorage.setItem('genImagesGridSize', size);
    renderGeneratedImagesReport(_currentImages);
  }
  function renderGeneratedImagesReport(images) {
    _currentImages = images;
    const el = document.getElementById('reportTable');
    const size = getImageGridSize();
    const sizeRow = `<div style="display:flex;gap:8px;padding:16px 16px 0;align-items:center">
      <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3)">Size</span>
      ${Object.keys(IMAGE_GRID_SIZES).map(s => `<button class="btn sm${s === size ? ' primary' : ''}" onclick="setImageGridSize('${s}')">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
    </div>`;
    if (!images.length) { el.innerHTML = sizeRow + '<div class="empty">No images generated yet.</div>'; return; }
    el.innerHTML = sizeRow + `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${IMAGE_GRID_SIZES[size]}px,1fr));gap:12px;padding:16px">` +
      images.map((img, i) => `
        <div style="cursor:pointer" onclick="openImageView(${i})">
          <img src="${escHtml(img.image_url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,0.08)"/>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px;text-align:center">${escHtml(img.created_at)}</div>
        </div>
      `).join('') + `</div>`;
  }
  function openImageView(i) {
    const img = _currentImages[i];
    document.getElementById('imageViewTitle').textContent = img.created_at;
    document.getElementById('imageViewImg').src = img.image_url;
    document.getElementById('copyImageBtn').textContent = 'Copy image';
    openModal('imageViewModal');
  }
  async function copyImageToClipboard() {
    const btn = document.getElementById('copyImageBtn');
    const url = document.getElementById('imageViewImg').src;
    try {
      // Per Bot 22 — same real bug fixed in the editor's Copy Image
      // button: awaiting fetch() before clipboard.write() loses the
      // user-gesture context in Safari (and some Chrome policies),
      // silently failing and leaving the clipboard's previous image
      // untouched. Passing the fetch as a still-pending promise directly
      // into ClipboardItem keeps the write tied to this click.
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': fetch(url).then(r => r.blob()) })
      ]);
      btn.textContent = 'Copied!';
    } catch(e) {
      // Clipboard image-write support (and same-origin/CORS access to
      // the blob) varies by browser; falling back to copying the URL as
      // plain text is still genuinely useful rather than just failing
      // silently.
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = 'Copied link (image copy unsupported here)';
      } catch(e2) {
        btn.textContent = 'Could not copy — try right-click > Copy Image';
      }
    }
    setTimeout(() => { btn.textContent = 'Copy image'; }, 2500);
  }

  async function openEmailJobContent(i) {
    const j = _currentJobs[i];
    document.getElementById('emailJobContentTitle').textContent = j.subject || '(no subject)';
    const body = document.getElementById('emailJobContentBody');
    body.innerHTML = '<div class="loading">Loading…</div>';
    openModal('emailJobContentModal');
    try {
      const res = await fetch(`/api/admin/email-log/${j.sample_id}/body`);
      const data = await res.json();
      body.innerHTML = data.html || '<div class="empty" style="color:#999">No stored content for this email — sent before body storage was added, or unavailable.</div>';
    } catch(e) {
      body.innerHTML = '<div class="empty" style="color:#999">Could not load the message content.</div>';
    }
  }

  async function openEmailJobLog(i) {
    const j = _currentJobs[i];
    document.getElementById('emailJobLogTitle').textContent = `${j.subject || '(no subject)'} — ${j.total} recipient${j.total > 1 ? 's' : ''}`;
    const el = document.getElementById('emailJobLogRows');
    el.innerHTML = '<div class="loading">Loading…</div>';
    openModal('emailJobLogModal');
    try {
      const params = new URLSearchParams();
      if (j.newsletter_id) params.set('newsletterId', j.newsletter_id);
      else { params.set('kind', j.kind); params.set('subject', j.subject || ''); params.set('from', j.first_at); params.set('to', j.last_at); }
      const res = await fetch(`/api/admin/email-log/job-rows?${params}`);
      const rows = await res.json();
      if (!rows.length) { el.innerHTML = '<div class="empty">No rows found for this job.</div>'; return; }
      const statusColor = s => s === 'sent' ? 'rgba(180,230,200,0.85)' : s === 'failed' ? 'rgba(230,140,120,0.9)' : 'rgba(230,200,120,0.9)';
      el.innerHTML = rows.map(r => `
        <div class="job-log-row" style="padding:11px 20px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="display:flex;align-items:center;gap:14px;font-size:13px">
            <div style="flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,0.6)" title="${escHtml(r.email)}">${escHtml(r.email)}</div>
            <div style="flex:1;color:rgba(255,255,255,0.6)">${escHtml(r.created_at)}</div>
            <div style="flex:0 0 60px;color:${statusColor(r.status)}">${escHtml(r.status)}</div>
            <div style="flex:0 0 60px;text-align:right">${r.status === 'failed' ? `<button class="btn sm" onclick="toggleRowError(this)">Error</button>` : ''}</div>
          </div>
          <div class="row-error" style="display:none;font-size:12px;color:rgba(230,140,120,0.85);padding-top:6px" data-error="${escHtml(r.error || '—')}"></div>
        </div>
      `).join('');
    } catch(e) {
      el.innerHTML = '<div class="empty">Could not load rows for this job.</div>';
    }
  }

  function toggleRowError(btn) {
    const wrap = btn.closest('.job-log-row');
    const errEl = wrap.querySelector('.row-error');
    if (errEl.style.display === 'none') { errEl.textContent = errEl.dataset.error; errEl.style.display = 'block'; btn.textContent = 'Hide'; }
    else { errEl.style.display = 'none'; btn.textContent = 'Error'; }
  }

  async function loadReportList() {
    try {
      const res = await fetch('/api/admin/reports');
      _reports = await res.json();
      renderReportPicker();
      if (_reports.length) loadReport(_reports[0].id);
    } catch(e) {
      document.getElementById('reportPicker').innerHTML = '<div class="empty">Could not load the report list.</div>';
    }
  }

  function renderReportPicker() {
    const el = document.getElementById('reportPicker');
    if (!_reports.length) { el.innerHTML = '<div class="empty">No reports registered yet.</div>'; return; }
    const byCategory = {};
    _reports.forEach(r => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });
    el.innerHTML = Object.entries(byCategory).map(([category, reports]) => `
      <div class="report-group">
        <div class="report-group-label">${escHtml(category)}</div>
        <div class="report-btn-row">
          ${reports.map(r => `<button class="report-btn" id="reportBtn-${r.id}" onclick="loadReport('${r.id}')">${escHtml(r.title)}</button>`).join('')}
        </div>
      </div>
    `).join('');
  }

  async function loadReport(id) {
    _currentReportId = id;
    document.querySelectorAll('.report-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`reportBtn-${id}`);
    if (btn) btn.classList.add('active');

    const section = document.getElementById('reportDetailSection');
    section.style.display = '';
    document.getElementById('reportTiles').innerHTML = '<div class="loading">Loading…</div>';
    document.getElementById('reportTable').innerHTML = '';
    document.getElementById('reportNote').style.display = 'none';

    try {
      const res = await fetch(`/api/admin/reports/${id}`);
      const data = await res.json();
      if (!res.ok || data.error) {
        document.getElementById('reportTiles').innerHTML = `<div class="empty">${escHtml(data.error || 'Could not load this report.')}</div>`;
        return;
      }
      document.getElementById('reportDetailLabel').textContent = data.category || '';
      document.getElementById('reportDetailTitle').textContent = data.title || '';

      document.getElementById('reportTiles').innerHTML = (data.tiles || []).map(t => `
        <div class="tile">
          <div class="tile-value">${escHtml(t.value)}</div>
          <div class="tile-label">${escHtml(t.label)}</div>
        </div>
      `).join('') || '<div class="empty">No summary figures for this report.</div>';

      const tableEl = document.getElementById('reportTable');
      if (data.jobs) {
        renderEmailLogReport(data.jobs);
      } else if (data.images) {
        renderGeneratedImagesReport(data.images);
      } else if (data.table && data.table.rows && data.table.rows.length) {
        tableEl.innerHTML =
          `<div class="report-table-hdr">${data.table.columns.map(c => `<div>${escHtml(c)}</div>`).join('')}</div>` +
          data.table.rows.map(row => `<div class="report-table-row">${row.map(cell => `<div title="${escHtml(cell)}">${escHtml(cell)}</div>`).join('')}</div>`).join('');
      } else if (data.table) {
        tableEl.innerHTML = '<div class="empty">No data yet for this report.</div>';
      } else {
        tableEl.innerHTML = '';
      }

      if (data.note) {
        document.getElementById('reportNote').textContent = data.note;
        document.getElementById('reportNote').style.display = '';
      }
    } catch(e) {
      document.getElementById('reportTiles').innerHTML = '<div class="empty">Could not load this report — try Refresh.</div>';
    }
  }

  loadReportList();

</script>
</body>
</html>
