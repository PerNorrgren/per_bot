<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — Admin · Deeper Mindfulness</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <script src="/js/dialogs.js"></script>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; font-family:'Georgia',serif; background:#0d1210; color:rgba(255,255,255,0.82); overflow-y:auto; }

    .topbar { padding:14px 28px 12px; background:#0d1210; border-bottom:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; align-items:stretch; gap:10px; position:sticky; top:0; z-index:10; }
    /* Per Bot 24 — two-row header: the logo/account row and the section
       nav row used to share one horizontal line, cramming every nav
       button to the far right. flex-direction:column above is the whole
       fix — the two existing children (logo block, .topbar-right) simply
       stack instead of sitting side by side, no markup changes needed. */
    .logo { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
    .logo-name { font-size:18px; color:rgba(255,255,255,0.78); }
    .topbar-right { display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; justify-content:flex-start; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); }
    .btn { padding:7px 16px; border-radius:7px; border:1px solid rgba(255,255,255,0.12); background:none; color:rgba(255,255,255,0.5); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; font-family:'Georgia',serif; text-decoration:none; display:inline-flex; align-items:center; transition:all 0.2s; }
    .btn:hover { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.8); }
    .btn.primary { border-color:rgba(180,230,200,0.35); color:rgba(180,230,200,0.75); }
    .btn.primary:hover { background:rgba(180,230,200,0.1); }
    .nav-badge { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:rgba(220,80,70,0.92); color:#fff; font-size:10px; font-weight:bold; margin-left:5px; line-height:1; vertical-align:middle; }

    .page { max-width:1040px; margin:0 auto; padding:32px 28px; display:flex; flex-direction:column; gap:28px; }
    .section-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:14px; }

    .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden; }
    .card-header { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:space-between; }
    .card-title { font-size:14px; color:rgba(255,255,255,0.75); }

    /* Report picker — grouped by category, button-per-report rather than
       a sidebar, consistent with how the rest of the admin panel favours
       flat button rows over nested navigation. */
    .report-group { margin-bottom:16px; }
    .report-group:last-child { margin-bottom:0; }
    .report-group-label { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.25); margin-bottom:8px; }
    .report-btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    .report-btn { padding:9px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.6); font-size:13px; font-family:'Georgia',serif; cursor:pointer; transition:all 0.15s; }
    .report-btn:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.85); }
    .report-btn.active { background:rgba(180,230,200,0.1); border-color:rgba(180,230,200,0.4); color:rgba(180,230,200,0.85); }

    .tiles { display:flex; flex-wrap:wrap; gap:14px; padding:20px; }
    .tile { flex:1 1 150px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:16px 18px; }
    .tile-value { font-size:26px; color:rgba(180,230,200,0.9); line-height:1.1; }
    .tile-label { font-size:11px; color:rgba(255,255,255,0.4); margin-top:6px; letter-spacing:0.02em; }

    .table { width:100%; max-height:420px; overflow-y:auto; }
    .report-table-row { display:flex; align-items:center; padding:11px 20px; border-bottom:1px solid rgba(255,255,255,0.04); gap:14px; font-size:13px; }
    .report-table-row:last-child { border-bottom:none; }
    .report-table-row > div { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,0.6); }
    .report-table-hdr { display:flex; align-items:center; padding:8px 20px; gap:14px; border-bottom:1px solid rgba(255,255,255,0.06); background:#141a17; position:sticky; top:0; }
    .report-table-hdr > div { flex:1; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.25); }

    .report-note { padding:14px 20px; font-size:12px; color:rgba(255,255,255,0.35); font-style:italic; border-top:1px solid rgba(255,255,255,0.05); }
    .empty { padding:28px 20px; font-size:13px; color:rgba(255,255,255,0.25); font-style:italic; }
    .loading { padding:28px 20px; font-size:13px; color:rgba(255,255,255,0.2); font-style:italic; }

    /* Per Bot 22 — this page had no modals at all before the Email Log's
       job-content/job-log drill-downs; same convention as every other
       admin page (openModal/closeModal toggling .open). */
    .modal-overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.72); backdrop-filter:blur(8px); align-items:flex-start; justify-content:center; padding:32px 20px; overflow-y:auto; }
    .modal-overlay.open { display:flex; }
    .modal { background:#131a17; border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px; width:100%; max-width:640px; margin:auto; display:flex; flex-direction:column; gap:14px; }
    .modal h3 { font-size:16px; font-weight:normal; color:rgba(255,255,255,0.85); }
    .modal-btns { display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
    .modal-cancel { padding:9px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:none; color:rgba(255,255,255,0.6); font-family:Georgia,serif; font-size:13px; cursor:pointer; }
    .btn.sm { padding:5px 12px; font-size:10px; }
</style>
</head>
<body>
  <div class="topbar">
    <div style="position:relative">
      <div class="logo" data-brand="name">Deeper Mindfulness</div>
      <button onclick="toggleAdminMenu()" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0;margin-top:2px">
        <span class="logo-name" style="font-size:18px">Reports</span>
        <span style="color:rgba(255,255,255,0.3);font-size:11px">▾</span>
      </button>
      <div id="adminMenu" style="display:none;position:absolute;top:100%;left:0;background:#1a2420;border:1px solid rgba(255,255,255,0.1);border-radius:0 0 10px 10px;z-index:50;min-width:160px;overflow:hidden">
        <a href="/account" style="display:block;width:100%;padding:11px 16px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:13px;font-family:Georgia,serif;cursor:pointer;text-align:left;text-decoration:none;box-sizing:border-box">My account</a>
        <button onclick="logout()" style="width:100%;padding:11px 16px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:13px;font-family:Georgia,serif;cursor:pointer;text-align:left">Sign out</button>
      </div>
    </div>
    <div class="topbar-right">
      <span id="a11yMenuSlot" style="position:relative"></span>
      <a href="/admin/" class="btn" style="position:relative">People<span id="peopleNavBadge" class="nav-badge" style="display:none"></span></a>
      <a href="/admin/content" class="btn">Content</a>
      <a href="/admin/talk" class="btn">Talk &amp; Tomte</a>
      <a href="/admin/comms" class="btn">Comms 1</a>
      <a href="/admin/comms2" class="btn" style="color:rgba(180,230,200,0.8)">Comms 2</a>
      <a href="/admin/sales" class="btn">Sales &amp; Marketing</a>
      <a href="/admin/reports" class="btn primary">Reports</a>
      <a href="/admin/pages" class="btn">Pages</a>
      <a href="/admin/social" class="btn">Social</a>
      <a href="/admin/forms" class="btn">Forms</a>
      <a href="/setup" class="btn">Settings</a>
    </div>
  </div>

  <div class="page">

    <div>
      <div class="section-label">Reports</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Choose a report</div>
        </div>
        <div style="padding:18px 20px" id="reportPicker">
          <div class="loading">Loading…</div>
        </div>
      </div>
    </div>

    <div id="reportDetailSection" style="display:none">
      <div class="section-label" id="reportDetailLabel"></div>
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="reportDetailTitle"></div>
          <button class="btn sm" onclick="loadReport(_currentReportId)">Refresh</button>
        </div>
        <div class="tiles" id="reportTiles"></div>
        <div class="table" id="reportTable"></div>
        <div class="report-note" id="reportNote" style="display:none"></div>
      </div>
    </div>

  </div>

  <!-- Per Bot 22 — Email Log job drill-downs. Content modal shows the
       actual stored HTML for a representative email in the job (safe to
       render directly — our own templates, admin-only page, same
       convention as the newsletter preview in Communications). Log modal
       shows every recipient row for that job, each failed one with an
       Error toggle rather than a third nested modal. -->
  <div class="modal-overlay" id="emailJobContentModal" onclick="if(event.target===this)closeModal('emailJobContentModal')">
    <div class="modal">
      <h3 id="emailJobContentTitle"></h3>
      <div id="emailJobContentBody" style="background:#f5f5f0;border-radius:10px;max-height:60vh;overflow-y:auto;color:#2a2a2a"></div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal('emailJobContentModal')">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="emailJobLogModal" onclick="if(event.target===this)closeModal('emailJobLogModal')">
    <div class="modal" style="max-width:720px">
      <h3 id="emailJobLogTitle"></h3>
      <div id="emailJobLogRows" style="max-height:60vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:10px"></div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal('emailJobLogModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Per Bot 22 — Generated Images report: click a thumbnail to view
       full size here. -->
  <div class="modal-overlay" id="imageViewModal" onclick="if(event.target===this)closeModal('imageViewModal')">
    <div class="modal" style="max-width:600px">
      <h3 id="imageViewTitle"></h3>
      <div style="background:#f5f5f0;border-radius:10px;padding:14px;max-height:70vh;overflow-y:auto">
        <img id="imageViewImg" src="" style="width:100%;display:block;border-radius:4px"/>
      </div>
      <div class="modal-btns">
        <button class="btn sm" id="copyImageBtn" onclick="copyImageToClipboard()">Copy image</button>
        <button class="modal-cancel" onclick="closeModal('imageViewModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Per App 35 — Campaigns report's issue detail: what actually went
       wrong, the post content (editable), its video if any, and four
       explicit actions with their own visible outcome, replacing a bare
       Resolve button that gave no feedback either way. -->
  <div class="modal-overlay" id="issueDetailModal" onclick="if(event.target===this)closeModal('issueDetailModal')">
    <div class="modal" style="max-width:640px">
      <h3>Posting issue</h3>
      <div id="issueDetailMeta" style="font-size:12px;color:rgba(255,255,255,0.5)"></div>
      <div id="issueDetailError" style="font-size:12.5px;color:rgba(230,140,120,0.85)"></div>
      <textarea id="issueDetailContent" rows="5" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:rgba(255,255,255,0.85);padding:10px;font-family:Georgia,serif;font-size:13px;resize:vertical"></textarea>
      <div id="issueDetailVideoWrap"></div>
      <div id="issueDetailFeedback" style="font-size:12px;min-height:16px"></div>
      <div class="modal-btns" style="justify-content:space-between;flex-wrap:wrap">
        <button class="btn sm" onclick="issueDetailAction('delete')" style="color:rgba(230,140,120,0.85)">Delete posting</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" onclick="issueDetailAction('save')">Save edit</button>
          <button class="btn sm" onclick="issueDetailAction('resend')">Resend now</button>
          <button class="btn sm primary" onclick="issueDetailAction('resolve')">Mark resolved</button>
          <button class="modal-cancel" onclick="closeModal('issueDetailModal')">Close</button>
        </div>
      </div>
    </div>
  </div>

<script>

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  async function logout()  { await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function toggleAdminMenu() {
    const m = document.getElementById('adminMenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const m = document.getElementById('adminMenu');
    if (m && !e.target.closest('.topbar')) m.style.display = 'none';
  });

  async function loadPeopleNavBadge() {
    try {
      const res = await fetch('/api/admin/notification-counts');
      const data = await res.json();
      const total = (data.pendingFacilitatorRequests||0) + (data.unseenEnquiries||0);
      const badge = document.getElementById('peopleNavBadge');
      if (!badge) return;
      if (total > 0) { badge.textContent = total > 9 ? '9+' : total; badge.style.display = 'inline-flex'; }
      else { badge.style.display = 'none'; }
    } catch(e) { /* quiet -- decorative */ }
  }
  loadPeopleNavBadge();

  // ── Reports hub ──
  // Per Bot 20 — a genuine framework: this page has no report-specific
  // logic at all. It fetches the list of registered reports from the
  // server, renders one button per report grouped by category, and
  // renders whatever shape { tiles, table, note } comes back for
  // whichever one is selected. Adding a new report later never touches
  // this file — it's a new function in db.js plus one line in server.js's
  // REPORTS registry.
  let _reports = [];
  let _currentReportId = null;

  // Per Bot 22 — Email Log's jobs view. One row per send action (see
  // db.getEmailJobs) rather than one row per recipient — click a row for
  // the message content, click Log for the per-recipient breakdown.
  let _currentJobs = [];
  function renderEmailLogReport(jobs) {
    _currentJobs = jobs;
    const el = document.getElementById('reportTable');
    if (!jobs.length) { el.innerHTML = '<div class="empty">No email activity yet.</div>'; return; }
    el.innerHTML =
      `<div class="report-table-hdr">
        <div>Sent at</div><div>Audience</div><div>Subject</div><div>Kind</div><div>Status</div><div style="flex:0 0 70px"></div>
      </div>` +
      jobs.map((j, i) => {
        const audience = j.total > 1 ? `${j.total} recipients` : (j.sole_email || '—');
        const statusBits = [
          j.sent ? `<span style="color:rgba(180,230,200,0.85)">${j.sent} sent</span>` : '',
          j.failed ? `<span style="color:rgba(230,140,120,0.9)">${j.failed} failed</span>` : '',
          j.pending ? `<span style="color:rgba(230,200,120,0.9)">${j.pending} pending</span>` : '',
        ].filter(Boolean).join(' · ') || '—';
        return `<div class="report-table-row" style="cursor:pointer" onclick="openEmailJobContent(${i})">
          <div title="${escHtml(j.first_at)}">${escHtml(j.first_at)}</div>
          <div title="${escHtml(audience)}">${escHtml(audience)}</div>
          <div title="${escHtml(j.subject || '—')}">${escHtml(j.subject || '—')}</div>
          <div>${escHtml(j.kind)}</div>
          <div style="overflow:visible;text-overflow:clip;white-space:normal">${statusBits}</div>
          <div style="flex:0 0 70px;text-align:right" onclick="event.stopPropagation()">
            <button class="btn sm" onclick="openEmailJobLog(${i})">Log</button>
          </div>
        </div>`;
      }).join('');
  }

  // Per App 31 — Email Health: everyone currently flagged (auto-detected,
  // awaiting review) or failed (admin-confirmed, already off the
  // newsletter list). Flagged rows get both actions; failed rows are
  // shown for visibility only — that state only ever changes by editing
  // the person directly in People, not from here, since it's already the
  // settled outcome.
  async function renderEmailHealthReport(rows) {
    const el = document.getElementById('reportTable');
    if (!rows.length) { el.innerHTML = '<div class="empty">Nothing flagged right now.</div>'; return; }
    el.innerHTML =
      `<div class="report-table-hdr">
        <div>Name</div><div>Email</div><div>Status</div><div style="flex:2">Reason</div><div style="flex:0 0 170px"></div>
      </div>` +
      rows.map(r => `
        <div class="report-table-row">
          <div title="${escHtml(r.name || '—')}">${escHtml(r.name || '—')}</div>
          <div title="${escHtml(r.email || '—')}">${escHtml(r.email || '—')}</div>
          <div style="color:${r.email_health === 'failed' ? 'rgba(230,140,120,0.9)' : 'rgba(230,200,120,0.9)'}">${r.email_health}</div>
          <div style="flex:2;overflow:visible;text-overflow:clip;white-space:normal" title="${escHtml(r.email_health_reason || '')}">${escHtml(r.email_health_reason || '—')}</div>
          <div style="flex:0 0 170px;text-align:right">
            ${r.email_health === 'flagged' ? `
              <button class="btn sm" onclick="dismissEmailHealthFlag('${r.id}')">Dismiss</button>
              <button class="btn sm" style="border-color:rgba(230,140,120,0.4);color:rgba(230,140,120,0.85)" onclick="confirmEmailHealthFailed('${r.id}')">Confirm failed</button>
            ` : ''}
          </div>
        </div>
      `).join('');
  }
  async function dismissEmailHealthFlag(userId) {
    if (!(await appConfirm('Dismiss this flag? Their email health resets to normal and they stay on the newsletter list.'))) return;
    await fetch(`/api/admin/email-health/${userId}/dismiss`, { method: 'POST' });
    loadReport('email_health');
  }
  async function confirmEmailHealthFailed(userId) {
    if (!(await appConfirm('Confirm this address as failed? This turns off their newsletter emails — their other preferences (reminders, renewal, etc.) are left alone.'))) return;
    await fetch(`/api/admin/email-health/${userId}/confirm-failed`, { method: 'POST' });
    loadReport('email_health');
  }

  // Per Bot 22 — Generated Images: the sumi-e image generator's history.
  // A thumbnail grid with a size control, click one to view it full size.
  let _currentImages = [];
  // Persisted across visits — a real webpage, not a sandboxed artifact,
  // so localStorage is fine here (unlike in Claude-generated artifacts,
  // where it isn't supported).
  const IMAGE_GRID_SIZES = { small: 80, medium: 120, large: 180 };
  function getImageGridSize() {
    return IMAGE_GRID_SIZES[localStorage.getItem('genImagesGridSize')] ? localStorage.getItem('genImagesGridSize') : 'medium';
  }
  function setImageGridSize(size) {
    localStorage.setItem('genImagesGridSize', size);
    renderGeneratedImagesReport(_currentImages);
  }
  function renderGeneratedImagesReport(images) {
    _currentImages = images;
    const el = document.getElementById('reportTable');
    const size = getImageGridSize();
    const sizeRow = `<div style="display:flex;gap:8px;padding:16px 16px 0;align-items:center">
      <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.3)">Size</span>
      ${Object.keys(IMAGE_GRID_SIZES).map(s => `<button class="btn sm${s === size ? ' primary' : ''}" onclick="setImageGridSize('${s}')">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
    </div>`;
    if (!images.length) { el.innerHTML = sizeRow + '<div class="empty">No images generated yet.</div>'; return; }
    el.innerHTML = sizeRow + `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${IMAGE_GRID_SIZES[size]}px,1fr));gap:12px;padding:16px">` +
      images.map((img, i) => `
        <div style="cursor:pointer" onclick="openImageView(${i})">
          <img src="${escHtml(img.image_url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,0.08)"/>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px;text-align:center">${escHtml(img.created_at)}</div>
        </div>
      `).join('') + `</div>`;
  }
  function openImageView(i) {
    const img = _currentImages[i];
    document.getElementById('imageViewTitle').textContent = img.created_at;
    document.getElementById('imageViewImg').src = img.image_url;
    document.getElementById('copyImageBtn').textContent = 'Copy image';
    openModal('imageViewModal');
  }
  async function copyImageToClipboard() {
    const btn = document.getElementById('copyImageBtn');
    const url = document.getElementById('imageViewImg').src;
    try {
      // Per Bot 22 — same real bug fixed in the editor's Copy Image
      // button: awaiting fetch() before clipboard.write() loses the
      // user-gesture context in Safari (and some Chrome policies),
      // silently failing and leaving the clipboard's previous image
      // untouched. Passing the fetch as a still-pending promise directly
      // into ClipboardItem keeps the write tied to this click.
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': fetch(url).then(r => r.blob()) })
      ]);
      btn.textContent = 'Copied!';
    } catch(e) {
      // Clipboard image-write support (and same-origin/CORS access to
      // the blob) varies by browser; falling back to copying the URL as
      // plain text is still genuinely useful rather than just failing
      // silently.
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = 'Copied link (image copy unsupported here)';
      } catch(e2) {
        btn.textContent = 'Could not copy — try right-click > Copy Image';
      }
    }
    setTimeout(() => { btn.textContent = 'Copy image'; }, 2500);
  }

  // Per's request — the Campaigns report. Per campaign: name/status,
  // per-channel sent/failed totals, and its own currently-open issues
  // with a one-click Resolve — these three are always shown in full,
  // never touched by the filters below (they're the at-a-glance totals,
  // not a search result). Below that, the actual send log — Per App 35
  // made this filterable: the three tiles double as a campaign-status
  // filter (click one to narrow to just active/paused/campaigns with
  // open issues, click the selected one again for "all"), a dropdown to
  // narrow further to one specific campaign, and channel/sent-failed
  // dropdowns that filter the send lines themselves via
  // getPostingSendHistory. Each line needs an actual <video> element
  // for its attached video, not an escaped text cell — deliberately
  // custom-rendered rather than forced into the generic flat table
  // above.
  let _campaignsReportData = [];
  let _campaignStatusFilter = 'all'; // 'all' | 'active' | 'paused' | 'issues'
  function campaignTileClick(bucket) {
    _campaignStatusFilter = (_campaignStatusFilter === bucket) ? 'all' : bucket;
    document.getElementById('campaignFilterSelect').value = ''; // status bucket changed — a previously-picked campaign may no longer be in it
    renderCampaignsReport(_campaignsReportData);
  }
  function campaignsMatchingStatusFilter(campaigns) {
    if (_campaignStatusFilter === 'active') return campaigns.filter(e => e.campaign.status === 'active');
    if (_campaignStatusFilter === 'paused') return campaigns.filter(e => e.campaign.status === 'paused');
    if (_campaignStatusFilter === 'issues') return campaigns.filter(e => e.openIssues.length > 0);
    return campaigns;
  }
  function renderCampaignsReport(data) {
    const campaigns = data.campaigns;
    _campaignsReportData = data;
    const tilesEl = document.getElementById('reportTiles');
    // Value/label come straight from data.tiles (server's real totals —
    // notably countOpenPostingIssues() is NOT the same number as summing
    // each campaign's openIssues here, since that array is capped at 15
    // per campaign for display; only the bucket MEMBERSHIP check below
    // needs "has at least one", which the cap doesn't affect).
    const tileDefs = [
      { bucket: 'active', ...( data.tiles[0] || {} ) },
      { bucket: 'paused', ...( data.tiles[1] || {} ) },
      { bucket: 'issues', ...( data.tiles[2] || {} ) },
    ];
    tilesEl.innerHTML = tileDefs.map(t => `
      <div class="tile" style="cursor:pointer${_campaignStatusFilter === t.bucket ? ';border-color:rgba(180,230,200,0.5);background:rgba(180,230,200,0.07)' : ''}" onclick="campaignTileClick('${t.bucket}')">
        <div class="tile-value">${escHtml(t.value)}</div>
        <div class="tile-label">${escHtml(t.label)}</div>
      </div>`).join('');

    const el = document.getElementById('reportTable');
    if (!campaigns.length) { el.innerHTML = '<div class="empty">No active or paused campaigns right now.</div>'; return; }

    const bucketCampaigns = campaignsMatchingStatusFilter(campaigns);
    const campaignSelect = document.getElementById('campaignFilterSelect');
    const prevSelected = campaignSelect ? campaignSelect.value : '';
    const stillValid = bucketCampaigns.some(e => e.campaign.id === prevSelected);
    const selectedCampaignId = stillValid ? prevSelected : '';
    const shown = selectedCampaignId ? bucketCampaigns.filter(e => e.campaign.id === selectedCampaignId) : bucketCampaigns;

    // Per App 35 fix — these two selects get rebuilt from scratch on
    // every change (same as campaignFilterSelect above), so without
    // reading the outgoing element's value first and baking it back in
    // as `selected`, a fresh <select> with no memory of the choice was
    // silently replacing it: the dropdown visibly snapped back to "All"
    // the instant you picked something, AND loadCampaignSendLines below
    // read that just-reset default instead of what was actually chosen
    // — so the filter looked entirely broken, not just cosmetically off.
    const channelSelect = document.getElementById('sendChannelFilter');
    const selectedChannel = channelSelect ? channelSelect.value : '';
    const statusSelect = document.getElementById('sendStatusFilter');
    const selectedStatus = statusSelect ? statusSelect.value : '';

    const filtersHtml = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:3;background:#0d1210">
        <select id="campaignFilterSelect" onchange="renderCampaignsReport(_campaignsReportData)" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:rgba(255,255,255,0.75);font-size:12px;padding:5px 8px">
          <option value="">All campaigns${_campaignStatusFilter !== 'all' ? ` (${_campaignStatusFilter})` : ''}</option>
          ${bucketCampaigns.map(e => `<option value="${escHtml(e.campaign.id)}" ${e.campaign.id === selectedCampaignId ? 'selected' : ''}>${escHtml(e.campaign.name)}</option>`).join('')}
        </select>
        <select id="sendChannelFilter" onchange="renderCampaignsReport(_campaignsReportData)" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:rgba(255,255,255,0.75);font-size:12px;padding:5px 8px">
          <option value="" ${selectedChannel === '' ? 'selected' : ''}>All channels</option>
          <option value="facebook" ${selectedChannel === 'facebook' ? 'selected' : ''}>Facebook</option>
          <option value="linkedin" ${selectedChannel === 'linkedin' ? 'selected' : ''}>LinkedIn</option>
          <option value="instagram" ${selectedChannel === 'instagram' ? 'selected' : ''}>Instagram</option>
          <option value="threads" ${selectedChannel === 'threads' ? 'selected' : ''}>Threads</option>
          <option value="email" ${selectedChannel === 'email' ? 'selected' : ''}>Email</option>
        </select>
        <select id="sendStatusFilter" onchange="renderCampaignsReport(_campaignsReportData)" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:rgba(255,255,255,0.75);font-size:12px;padding:5px 8px">
          <option value="" ${selectedStatus === '' ? 'selected' : ''}>Sent + failed</option>
          <option value="sent" ${selectedStatus === 'sent' ? 'selected' : ''}>Sent only</option>
          <option value="failed" ${selectedStatus === 'failed' ? 'selected' : ''}>Failed only</option>
        </select>
      </div>`;

    const campaignBlocksHtml = shown.map(entry => {
      const c = entry.campaign;
      const byChannel = (entry.progress.byChannel || []).map(row =>
        `<span style="margin-right:14px">${escHtml(row.channel)}: ${row.sent_count} sent${row.failed_count ? `, <span style="color:rgba(230,140,120,0.85)">${row.failed_count} failed</span>` : ''}</span>`
      ).join('');
      // Per App 35 fix — this row list is its own scroll region now
      // (rather than flowing straight into the page's single scroll
      // area), so "Open issues (n)" — which sits outside/above it —
      // can't scroll out of view while reading down a long list; same
      // reasoning applies to the send-lines list below.
      // Per's request — every open issue is by definition a failure, so
      // showing this block while the Sent-only filter is selected made
      // no sense (it never changed, since it's intentionally unfiltered
      // otherwise — the true byChannel totals above stay unfiltered on
      // purpose, but "only show Sent" clearly means "not this").
      const issuesHtml = (entry.openIssues.length && selectedStatus !== 'sent') ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(230,140,120,0.25)">
          <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(230,140,120,0.75);margin-bottom:6px">Open issues (${entry.openIssues.length})</div>
          <div style="max-height:220px;overflow-y:auto;padding-right:4px">
            ${entry.openIssues.map(i => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:12px">
                <span style="color:rgba(255,255,255,0.6)"><b>${escHtml(i.channel)}</b> — ${escHtml(i.error || '')} <span style="color:rgba(255,255,255,0.3)">(${escHtml(i.sent_at)})</span></span>
                <button class="btn sm" onclick="openIssueDetailModal('${i.id}', '${c.id}')">Details</button>
              </div>
            `).join('')}
          </div>
          <button class="btn sm" style="margin-top:6px" onclick="resolveAllIssuesForCampaign('${c.id}')">Resolve all${selectedChannel ? ` (${selectedChannel} only)` : ' for this campaign'}</button>
        </div>` : '';
      return `
        <div style="padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.06)" data-campaign-block="${escHtml(c.id)}">
          <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
            <div style="font-size:15px;color:rgba(255,255,255,0.85)">${escHtml(c.name)} <span style="font-size:11px;color:rgba(255,255,255,0.35)">· ${escHtml(c.status)}${c.type ? ' · ' + escHtml(c.type) : ''}</span></div>
            <div style="font-size:11.5px;color:rgba(255,255,255,0.45)">${byChannel || 'No sends yet'}</div>
          </div>
          ${issuesHtml}
          <div id="sendLines-${escHtml(c.id)}" style="margin-top:6px;max-height:340px;overflow-y:auto;padding-right:4px"><div class="empty">Loading…</div></div>
        </div>
      `;
    }).join('');
    el.innerHTML = filtersHtml + (campaignBlocksHtml || '<div class="empty">No campaigns match this filter.</div>');

    shown.forEach(entry => loadCampaignSendLines(entry.campaign.id));
  }
  // Fetches and renders the filtered send lines for one campaign block —
  // each line is a real send attempt (getPostingSendHistory), not a pool
  // item, so it always has a genuine sent/failed status and a real
  // date/time. content/video come along on the same query so a line
  // reads the same as the old pool view used to, just per-attempt now.
  async function loadCampaignSendLines(campaignId) {
    const el = document.getElementById(`sendLines-${campaignId}`);
    if (!el) return; // report re-rendered/navigated away before this resolved
    const channel = document.getElementById('sendChannelFilter').value;
    const status = document.getElementById('sendStatusFilter').value;
    const params = new URLSearchParams({ campaignId });
    if (channel) params.set('channel', channel);
    if (status) params.set('status', status);
    try {
      const rows = await (await fetch(`/api/admin/postings/sends?${params}`)).json();
      if (!document.getElementById(`sendLines-${campaignId}`)) return; // filters changed again mid-fetch
      if (!rows.length) { el.innerHTML = '<div class="empty" style="padding:10px 0">No sends match this filter.</div>'; return; }
      el.innerHTML = rows.map(r => {
        const when = new Date(r.sent_at.replace(' ', 'T') + 'Z').toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
        const statusColor = r.status === 'failed' ? 'rgba(230,140,120,0.85)' : 'rgba(180,230,200,0.8)';
        return `
          <div style="border-top:1px solid rgba(255,255,255,0.06);padding:10px 0">
            <div style="font-size:11.5px;color:rgba(255,255,255,0.4);margin-bottom:4px">
              ${escHtml(r.channel)}${r.video_title ? ` · video: ${escHtml(r.video_title)}` : ''} ·
              <span style="color:${statusColor}">${escHtml(r.status)}</span> ·
              ${escHtml(when)}
            </div>
            <div style="font-size:12.5px;color:rgba(255,255,255,0.7);white-space:pre-wrap">${escHtml(r.content || '')}</div>
            ${r.status === 'failed' && r.error ? `<div style="font-size:11.5px;color:rgba(230,140,120,0.75);margin-top:4px">${escHtml(r.error)}</div>` : ''}
            ${r.media_url ? `<video src="${escHtml(r.media_url)}" controls style="max-width:180px;max-height:100px;margin-top:6px;border-radius:6px"></video>` : ''}
          </div>
        `;
      }).join('');
    } catch (e) {
      if (document.getElementById(`sendLines-${campaignId}`)) el.innerHTML = '<div class="empty" style="padding:10px 0">Could not load sends.</div>';
    }
  }
  // Per's request — refetches the report data and re-renders directly
  // (NOT via loadReport, which clears #reportTable to empty before the
  // fetch resolves — by the time render ran, campaignFilterSelect/
  // sendChannelFilter/sendStatusFilter would already be gone from the
  // DOM, so renderCampaignsReport's own "read the outgoing value first"
  // logic had nothing to read and every filter silently reset. This
  // updates the same live #reportTable in place instead.
  async function refreshCampaignsReportData() {
    const res = await fetch('/api/admin/reports/campaigns');
    const data = await res.json();
    if (!res.ok || data.error) return;
    renderCampaignsReport(data);
  }
  // Per's request — Resolve used to fire immediately with no feedback
  // (did it work? did it do anything at all?) and no way to see what
  // the problem even was first. This opens a modal with the full
  // context (content, video, error) and four explicit actions instead,
  // each with its own visible outcome. Looks the issue up from the
  // already-loaded report data rather than threading every field through
  // the onclick attribute — safer than escaping arbitrary post content
  // into HTML attribute syntax.
  let _issueDetail = null;
  function openIssueDetailModal(issueId, campaignId) {
    const entry = (_campaignsReportData.campaigns || []).find(e => e.campaign.id === campaignId);
    const issue = entry && entry.openIssues.find(i => i.id === issueId);
    if (!issue) return;
    _issueDetail = { issueId, campaignId, postingId: issue.posting_id };
    document.getElementById('issueDetailMeta').textContent = `${issue.channel} · ${issue.sent_at}`;
    document.getElementById('issueDetailError').textContent = issue.error || '';
    document.getElementById('issueDetailContent').value = issue.content || '';
    document.getElementById('issueDetailVideoWrap').innerHTML = issue.media_url
      ? `<video src="${escHtml(issue.media_url)}" controls style="max-width:220px;max-height:130px;border-radius:6px;margin-top:8px"></video>`
      : '<div style="font-size:11.5px;color:rgba(255,255,255,0.35);margin-top:8px">No video attached to this posting.</div>';
    document.getElementById('issueDetailFeedback').textContent = '';
    openModal('issueDetailModal');
  }
  async function issueDetailAction(action) {
    if (!_issueDetail) return;
    const { issueId, campaignId, postingId } = _issueDetail;
    const feedback = document.getElementById('issueDetailFeedback');
    feedback.style.color = 'rgba(255,255,255,0.45)';
    feedback.textContent = 'Working…';
    try {
      if (action === 'save') {
        const content = document.getElementById('issueDetailContent').value;
        const res = await fetch(`/api/admin/campaigns/${campaignId}/postings/${postingId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) throw new Error(data.error || 'Could not save the edit.');
        feedback.style.color = 'rgba(180,230,200,0.9)';
        feedback.textContent = 'Saved. This posting will use the new wording next time it sends.';
      } else if (action === 'resend') {
        const res = await fetch(`/api/admin/campaigns/${campaignId}/postings/${postingId}/publish-now`, { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) throw new Error(data.error || 'Resend failed.');
        feedback.style.color = 'rgba(180,230,200,0.9)';
        feedback.textContent = 'Resent — published live just now.';
        refreshCampaignsReportData();
      } else if (action === 'resolve') {
        const res = await fetch(`/api/admin/postings/issues/${issueId}/resolve`, { method: 'POST' });
        if (!res.ok) throw new Error('Could not mark this resolved.');
        closeModal('issueDetailModal');
        refreshCampaignsReportData();
        return;
      } else if (action === 'delete') {
        if (!(await appConfirm('Delete this posting entirely? Every open issue for it (not just this one) will also be marked resolved. This cannot be undone.'))) { feedback.textContent = ''; return; }
        const res = await fetch(`/api/admin/campaigns/${campaignId}/postings/${postingId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Could not delete the posting.');
        await fetch(`/api/admin/postings/${postingId}/issues/resolve-all`, { method: 'POST' }).catch(() => {});
        closeModal('issueDetailModal');
        refreshCampaignsReportData();
        return;
      }
    } catch (e) {
      feedback.style.color = 'rgba(230,140,120,0.9)';
      feedback.textContent = e.message;
    }
  }
  // Per's request — scoped to whichever channel is currently selected
  // in the filter (e.g. "mark all the LinkedIn issues resolved"),
  // leaving other channels' open issues untouched; with no channel
  // filter set, this is unchanged from before — every open issue for
  // the campaign.
  async function resolveAllIssuesForCampaign(campaignId) {
    const channel = document.getElementById('sendChannelFilter').value;
    const scopeText = channel ? `every open ${channel} issue for this campaign` : 'every open issue for this campaign';
    if (!(await appConfirm(`Mark ${scopeText} as resolved?`))) return;
    const params = channel ? `?channel=${encodeURIComponent(channel)}` : '';
    await fetch(`/api/admin/campaigns/${campaignId}/issues/resolve-all${params}`, { method: 'POST' });
    refreshCampaignsReportData();
  }

  async function openEmailJobContent(i) {
    const j = _currentJobs[i];
    document.getElementById('emailJobContentTitle').textContent = j.subject || '(no subject)';
    const body = document.getElementById('emailJobContentBody');
    body.innerHTML = '<div class="loading">Loading…</div>';
    openModal('emailJobContentModal');
    try {
      const res = await fetch(`/api/admin/email-log/${j.sample_id}/body`);
      const data = await res.json();
      body.innerHTML = data.html || '<div class="empty" style="color:#999">No stored content for this email — sent before body storage was added, or unavailable.</div>';
    } catch(e) {
      body.innerHTML = '<div class="empty" style="color:#999">Could not load the message content.</div>';
    }
  }

  async function openEmailJobLog(i) {
    const j = _currentJobs[i];
    document.getElementById('emailJobLogTitle').textContent = `${j.subject || '(no subject)'} — ${j.total} recipient${j.total > 1 ? 's' : ''}`;
    const el = document.getElementById('emailJobLogRows');
    el.innerHTML = '<div class="loading">Loading…</div>';
    openModal('emailJobLogModal');
    try {
      const params = new URLSearchParams();
      if (j.newsletter_id) params.set('newsletterId', j.newsletter_id);
      else { params.set('kind', j.kind); params.set('subject', j.subject || ''); params.set('from', j.first_at); params.set('to', j.last_at); }
      const res = await fetch(`/api/admin/email-log/job-rows?${params}`);
      const rows = await res.json();
      if (!rows.length) { el.innerHTML = '<div class="empty">No rows found for this job.</div>'; return; }
      const statusColor = s => s === 'sent' ? 'rgba(180,230,200,0.85)' : s === 'failed' ? 'rgba(230,140,120,0.9)' : 'rgba(230,200,120,0.9)';
      el.innerHTML = rows.map(r => `
        <div class="job-log-row" style="padding:11px 20px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="display:flex;align-items:center;gap:14px;font-size:13px">
            <div style="flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,0.6)" title="${escHtml(r.email)}">${escHtml(r.email)}</div>
            <div style="flex:1;color:rgba(255,255,255,0.6)">${escHtml(r.created_at)}</div>
            <div style="flex:0 0 60px;color:${statusColor(r.status)}">${escHtml(r.status)}</div>
            <div style="flex:0 0 60px;text-align:right">${r.status === 'failed' ? `<button class="btn sm" onclick="toggleRowError(this)">Error</button>` : ''}</div>
          </div>
          <div class="row-error" style="display:none;font-size:12px;color:rgba(230,140,120,0.85);padding-top:6px" data-error="${escHtml(r.error || '—')}"></div>
        </div>
      `).join('');
    } catch(e) {
      el.innerHTML = '<div class="empty">Could not load rows for this job.</div>';
    }
  }

  function toggleRowError(btn) {
    const wrap = btn.closest('.job-log-row');
    const errEl = wrap.querySelector('.row-error');
    if (errEl.style.display === 'none') { errEl.textContent = errEl.dataset.error; errEl.style.display = 'block'; btn.textContent = 'Hide'; }
    else { errEl.style.display = 'none'; btn.textContent = 'Error'; }
  }

  async function loadReportList() {
    try {
      const res = await fetch('/api/admin/reports');
      _reports = await res.json();
      renderReportPicker();
      if (_reports.length) loadReport(_reports[0].id);
    } catch(e) {
      document.getElementById('reportPicker').innerHTML = '<div class="empty">Could not load the report list.</div>';
    }
  }

  function renderReportPicker() {
    const el = document.getElementById('reportPicker');
    if (!_reports.length) { el.innerHTML = '<div class="empty">No reports registered yet.</div>'; return; }
    const byCategory = {};
    _reports.forEach(r => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });
    el.innerHTML = Object.entries(byCategory).map(([category, reports]) => `
      <div class="report-group">
        <div class="report-group-label">${escHtml(category)}</div>
        <div class="report-btn-row">
          ${reports.map(r => `<button class="report-btn" id="reportBtn-${r.id}" onclick="loadReport('${r.id}')">${escHtml(r.title)}</button>`).join('')}
        </div>
      </div>
    `).join('');
  }

  async function loadReport(id) {
    _currentReportId = id;
    document.querySelectorAll('.report-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`reportBtn-${id}`);
    if (btn) btn.classList.add('active');

    const section = document.getElementById('reportDetailSection');
    section.style.display = '';
    document.getElementById('reportTiles').innerHTML = '<div class="loading">Loading…</div>';
    document.getElementById('reportTable').innerHTML = '';
    document.getElementById('reportNote').style.display = 'none';

    try {
      const res = await fetch(`/api/admin/reports/${id}`);
      const data = await res.json();
      if (!res.ok || data.error) {
        document.getElementById('reportTiles').innerHTML = `<div class="empty">${escHtml(data.error || 'Could not load this report.')}</div>`;
        return;
      }
      document.getElementById('reportDetailLabel').textContent = data.category || '';
      document.getElementById('reportDetailTitle').textContent = data.title || '';

      // Campaigns' tiles double as click-to-filter controls and are
      // rendered by renderCampaignsReport itself, below — the generic
      // static render here would just get overwritten a line later and
      // lose the click handlers in the meantime.
      if (!data.campaigns) {
        document.getElementById('reportTiles').innerHTML = (data.tiles || []).map(t => `
          <div class="tile">
            <div class="tile-value">${escHtml(t.value)}</div>
            <div class="tile-label">${escHtml(t.label)}</div>
          </div>
        `).join('') || '<div class="empty">No summary figures for this report.</div>';
      }

      const tableEl = document.getElementById('reportTable');
      if (data.jobs) {
        renderEmailLogReport(data.jobs);
      } else if (data.emailHealth) {
        renderEmailHealthReport(data.emailHealth);
      } else if (data.images) {
        renderGeneratedImagesReport(data.images);
      } else if (data.campaigns) {
        renderCampaignsReport(data);
      } else if (data.table && data.table.rows && data.table.rows.length) {
        tableEl.innerHTML =
          `<div class="report-table-hdr">${data.table.columns.map(c => `<div>${escHtml(c)}</div>`).join('')}</div>` +
          data.table.rows.map(row => `<div class="report-table-row">${row.map(cell => `<div title="${escHtml(cell)}">${escHtml(cell)}</div>`).join('')}</div>`).join('');
      } else if (data.table) {
        tableEl.innerHTML = '<div class="empty">No data yet for this report.</div>';
      } else {
        tableEl.innerHTML = '';
      }

      if (data.note) {
        document.getElementById('reportNote').textContent = data.note;
        document.getElementById('reportNote').style.display = '';
      }
    } catch(e) {
      document.getElementById('reportTiles').innerHTML = '<div class="empty">Could not load this report — try Refresh.</div>';
    }
  }

  loadReportList();

</script>
</body>
</html>
