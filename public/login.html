<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deeper Mindfulness</title>
  <link rel="icon" href="/favicon-dynamic"/>
  <link rel="apple-touch-icon" href="/favicon-dynamic"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <script src="/brand-inject.js"></script>
  <script src="/js/dialogs.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; font-family:'Georgia',serif; background:#0a0f0d; display:flex; align-items:center; justify-content:center; }

    .slideshow { position:fixed; inset:0; z-index:0; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 3s ease-in-out; }
    .slide.active { opacity:1; }
    .veil { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,0.5); }

    .panel { position:relative; z-index:2; width:100%; max-width:380px; padding:20px; }

    .glass {
      background:rgba(255,255,255,0.07);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:40px 36px 36px;
      display:flex; flex-direction:column; gap:24px;
    }

    /* Per's request — same edge-to-edge treatment as the main app: on
       phone-width screens, no outer margin around the card. Width only
       (not height) — this is a naturally-sized login form, not a
       full-screen app frame, so stretching it to fill the viewport
       height would leave a large empty gap rather than looking more
       "full screen". The card's own internal padding is untouched, so
       the form fields stay just as readable. */
    @media (max-width: 500px) {
      .panel { max-width:100%; padding:0; }
      .glass { border-radius:0; }
    }

    .wordmark { text-align:center; }
    .wordmark-main { font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.4); display:block; }
    .wordmark-sub { font-size:20px; color:rgba(255,255,255,0.8); display:block; margin-top:6px; }

    .form { display:flex; flex-direction:column; gap:14px; }

    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
    .field input {
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
      border-radius:10px; padding:12px 14px; font-size:15px;
      color:rgba(255,255,255,0.85); font-family:'Georgia',serif; outline:none;
      transition:border-color 0.2s;
    }
    .field input:focus { border-color:rgba(180,230,200,0.4); }
    .field input::placeholder { color:rgba(255,255,255,0.2); }

    .error { font-size:13px; color:rgba(255,140,120,0.85); text-align:center; min-height:18px; }

    .submit-btn {
      width:100%; padding:13px; border-radius:10px;
      border:1px solid rgba(180,230,200,0.3);
      background:rgba(180,230,200,0.1);
      color:rgba(180,230,200,0.85); font-size:13px;
      letter-spacing:0.12em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s; font-family:'Georgia',serif;
    }
    .submit-btn:hover { background:rgba(180,230,200,0.18); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }

    /* Per's request — Explore Free was a quiet ghost-outline link, same
       visual weight as any secondary action, easy to scroll past. This
       is arguably the more important action on this screen for anyone
       who isn't already a member, so it now reads as bolder and brighter
       than Sign In itself, not just equal to it. */
    .explore-btn {
      display:block; width:100%; padding:15px; border-radius:10px;
      border:1px solid rgba(180,230,200,0.55);
      background:rgba(180,230,200,0.22);
      color:rgba(220,250,230,0.98); font-size:13.5px; font-weight:bold;
      letter-spacing:0.12em; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s; font-family:'Georgia',serif;
      text-align:center; text-decoration:none;
      box-shadow:0 0 0 1px rgba(180,230,200,0.12), 0 4px 18px rgba(180,230,200,0.15);
    }
    .explore-btn:hover { background:rgba(180,230,200,0.32); border-color:rgba(180,230,200,0.75); }

    .footer-note { text-align:center; font-size:11px; color:rgba(255,255,255,0.2); }
  /* Role chooser modal */
  .role-modal { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:20px; }
  .role-modal.visible { display:flex; }
  .role-inner { background:#0f1a16; border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:36px 32px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:16px; text-align:center; }
  .role-inner h3 { font-size:20px; color:rgba(255,255,255,0.85); font-weight:normal; }
  .role-inner p { font-size:14px; color:rgba(255,255,255,0.4); line-height:1.7; }
  .role-btn { width:100%; padding:14px; border-radius:10px; font-family:'Georgia',serif; font-size:14px; letter-spacing:0.08em; cursor:pointer; transition:all 0.2s; }
  .role-btn-primary { border:1px solid rgba(180,230,200,0.35); background:rgba(180,230,200,0.1); color:rgba(180,230,200,0.85); }
  .role-btn-primary:hover { background:rgba(180,230,200,0.2); }
  .role-btn-secondary { border:1px solid rgba(255,255,255,0.12); background:none; color:rgba(255,255,255,0.45); }
  .role-btn-secondary:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>
  <div class="veil"></div>

  <div class="panel">
    <div class="glass">
      <div class="wordmark">
        <span class="wordmark-main" data-brand="name">Deeper Mindfulness</span>
        <span class="wordmark-sub">Sign in</span>
      </div>

      <div class="form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <div style="position:relative">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px"/>
            <button type="button" id="togglePw" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;padding:4px;line-height:1;display:flex;align-items:center">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="error" id="error"></div>
        <div style="text-align:right;margin-top:-6px">
          <a href="#" onclick="showForgotPassword();return false" style="color:rgba(255,255,255,0.35);text-decoration:none;font-size:12px">Forgot password?</a>
        </div>
        <button class="submit-btn" id="submitBtn">Sign in</button>

        <div id="forgotPasswordArea" style="display:none;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.08)">
          <div style="font-size:12px;color:rgba(255,255,255,0.4);line-height:1.6">Enter your email and, if it matches an account, we'll send a link to reset your password.</div>
          <input type="email" id="forgotEmail" placeholder="your@email.com" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:14px;color:rgba(255,255,255,0.85);font-family:'Georgia',serif;outline:none"/>
          <div id="forgotMsg" style="font-size:12px;color:rgba(180,230,200,0.85);min-height:16px"></div>
          <button class="submit-btn" id="forgotBtn">Send reset link</button>
        </div>

        <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
          <span style="font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:0.08em">or</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
        </div>

        <a href="/register" id="createAccountLink" class="explore-btn" onmouseover="this.style.background='rgba(180,230,200,0.32)'" onmouseout="this.style.background='rgba(180,230,200,0.22)'">Explore Free — No Card Needed</a>
      </div>

      <div class="footer-note">
        <span><span data-brand="name">Deeper Mindfulness</span> · Per Norrgren</span>
      </div>
    </div>
  </div>

  <script>
    // Per Bot 33n — both "create account" links defaulted to plain /register,
    // silently dropping the skin context the moment someone clicked through
    // from a skin's own /login/:slug page. window.__skinSlug is set
    // synchronously by brand-inject.js (doesn't need to wait on the async
    // brandReady promise), so this can run immediately.
    if (window.__skinSlug) {
      const registerUrl = '/register/' + window.__skinSlug;
      const createLink = document.getElementById('createAccountLink');
      if (createLink) createLink.href = registerUrl;
    }

    const defaultSlides = [
      'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1600&q=80',
      'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600&q=80',
      'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=80',
      'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80',
      'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&q=80',
    ];
    // Per Bot 20: waits for brandReady so a skin's own background images
    // (if this is a /login/:slug visit) are known before building the
    // slideshow — falls back to the standard set otherwise, same as always.
    window.brandReady.then(() => {
      const slides = (window.__skinBackgroundImages && window.__skinBackgroundImages.length) ? window.__skinBackgroundImages : defaultSlides;
      const ss = document.getElementById('slideshow');
      const slideEls = slides.map((url, i) => {
        const d = document.createElement('div');
        d.className = 'slide' + (i === 0 ? ' active' : '');
        d.style.backgroundImage = `url('${url}')`;
        ss.appendChild(d); return d;
      });
      let cur = 0;
      setInterval(() => {
        slideEls[cur].classList.remove('active');
        cur = (cur + 1) % slideEls.length;
        slideEls[cur].classList.add('active');
      }, 9000);
    });

    // Check for error/message in URL
    const params = new URLSearchParams(location.search);
    if (params.get('error') === 'invalid') {
      document.getElementById('error').textContent = 'Email or password not recognised.';
    }
    if (params.get('error') === 'session') {
      document.getElementById('error').textContent = 'Session expired. Please sign in again.';
    }
    // Per Bot 19 — links generated for someone who already has an account
    // (e.g. the newsletter-welcome email, sent via {{invite_link}} when
    // has_login is true) carry ?email=... so they land here with it
    // already filled in and focus straight on the password field, rather
    // than needing to retype an address they just clicked a link from.
    if (params.get('email')) {
      document.getElementById('email').value = params.get('email');
      document.getElementById('password').focus();
    }

    function togglePassword() {
      const input     = document.getElementById('password');
      const eyeOpen   = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');
      const btn       = document.getElementById('togglePw');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display   = 'none';
        eyeClosed.style.display = '';
        btn.style.color = 'rgba(180,230,200,0.6)';
      } else {
        input.type = 'password';
        eyeOpen.style.display   = '';
        eyeClosed.style.display = 'none';
        btn.style.color = 'rgba(255,255,255,0.3)';
      }
    }

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('submitBtn');
      const errorEl  = document.getElementById('error');

      if (!email || !password) { errorEl.textContent = 'Please enter email and password.'; return; }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errorEl.textContent = '';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.chooseRole) {
        // Dual-role user — show chooser modal
        document.getElementById('roleModalName').textContent = 'You have access to both a practice space and the facilitator area.';
        document.getElementById('roleModal').classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      } else if (data.redirect) {
        // Per's request — a reminder email needs to "open the app to the
        // course page," which for someone not already logged in means
        // surviving the login step first. ?next= is only ever honoured
        // for a client-role login (data.redirect === '/client/') — never
        // for admin/facilitator, so a crafted link can't redirect someone
        // into a different area than their actual role.
        const next = new URLSearchParams(location.search).get('next');
        if (next && data.redirect === '/client/') { window.location.href = decodeURIComponent(next); }
        else { window.location.href = data.redirect; }
      } else {
        errorEl.textContent = data.error || 'Something went wrong.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    async function goToRole(role) {
      if (role === 'client') {
        // Swap session cookie to client role before redirecting
        const r    = await fetch('/api/switch-to-client', { method: 'POST' });
        const data = await r.json();
        if (data.redirect) { window.location.href = data.redirect; return; }
        if (data.error)    { appAlert(data.error); return; }
      }
      const map = { facilitator: '/facilitator/', admin: '/admin/' };
      window.location.href = map[role] || '/login';
    }

    document.getElementById('submitBtn').addEventListener('click', doLogin);
    document.getElementById('forgotBtn').addEventListener('click', sendForgotPassword);

    function showForgotPassword() {
      document.getElementById('forgotPasswordArea').style.display = 'flex';
      document.getElementById('forgotEmail').value = document.getElementById('email').value;
      document.getElementById('forgotEmail').focus();
    }
    async function sendForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const btn   = document.getElementById('forgotBtn');
      const msg   = document.getElementById('forgotMsg');
      if (!email) { msg.style.color = 'rgba(255,140,120,0.85)'; msg.textContent = 'Enter your email first.'; return; }
      btn.disabled = true;
      btn.textContent = 'Sending\u2026';
      try {
        await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
      } catch(e) {}
      msg.style.color = 'rgba(180,230,200,0.85)';
      msg.textContent = 'If that email matches an account, a reset link is on its way.';
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
<!-- Role chooser modal — shown when user has both facilitator and client roles -->
<div class="role-modal" id="roleModal">
  <div class="role-inner">
    <h3>Welcome back</h3>
    <p id="roleModalName"></p>
    <p style="font-size:13px;color:rgba(255,255,255,0.3)">Where would you like to go?</p>
    <button class="role-btn role-btn-primary" onclick="goToRole('client')">My Practice</button>
    <button class="role-btn role-btn-secondary" onclick="goToRole('facilitator')">Facilitator</button>
  </div>
</div>


<script>window.TOMTE_PAGE = 'Login';</script>
<script src="/tomte-widget.js" defer></script>
</body>
</html>
